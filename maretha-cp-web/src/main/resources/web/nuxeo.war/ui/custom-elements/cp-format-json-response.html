<dom-module id="cp-format-json-response">
  <template>

    <div id="response"></div>
    <div class="markdown-body" inner-h-t-m-l="[[htmlMarkdown]]"></div>

  </template>

  <script>
    Polymer({
      is: 'cp-format-json-response',
      behaviors: [Nuxeo.LayoutBehavior, Nuxeo.ConfigurationBehaviour],
      properties: {

        stringJson: {
          type: Object,
        },

        json: {
          type: Object,
        },

        htmlMarkdown: {
          type: String,
        }

      },

      observers: ['_stringJsonToHtmlObserver(stringJson)', '_jsonToHtmlObserver(json)'],

      ready: function () {
      },

      _stringJsonToHtmlObserver: function (stringJson) {
        const json = JSON.parse(stringJson);
        this.set('htmlMarkdown', this._formatJson(json));
      },

      _jsonToHtmlObserver: function (json) {
        this.set('htmlMarkdown', this._formatJson(this?.json));
      },

      _formatJson: function (jsonObj, indent = 0) {
        let result = '';
        const indentation = ' '.repeat(indent);

        for (const [key, value] of Object.entries(jsonObj)) {
          if (typeof value === 'object' && !Array.isArray(value)) {
            result += `${indentation}${key}:\n`;
            result += this._formatJson(value, indent + 4);
          } else if (Array.isArray(value)) {
            result += `${indentation}${key}: ${value.join(', ')}\n`;
          } else {
            result += `${indentation}${key}: ${value}\n`;
          }
        }
        return result;
      }

    });
  </script>
</dom-module>
