<link rel="import" href="./cp-settings-interactions.html">
<link rel="import" href="./cp-settings-metadata.html">
<link rel="import" href="./cp-settings-elasticsearch.html">
<link rel="import" href="./cp-settings-vertesia.html">
<link rel="import" href="./cp-settings-events.html">

<dom-module id="cp-settings">
	<template>
		<style include="nuxeo-styles">
			::-webkit-scrollbar {
				height: 7px;
				width: 7px;
				background: #edeeef;
				box-shadow: none;
			}

			::-webkit-scrollbar-thumb {
				background: #cdcdcd;
				box-shadow: none;
			}

			.primary:not([disabled]) {
				--iron-icon-fill-color: var(--nx-button-primary_-_background-color);
			}

			#documentViewsItems {
				@apply --layout-horizontal;
				--paper-listbox-background-color: transparent;
			}

			paper-listbox {
				padding: 0;
			}

			@media (max-width: 1024px) {
				paper-listbox {
					padding-right: 7rem;
				}
			}

			.page-header {
				display: flex;
				align-items: center;
				gap: 1rem;
			}

			.page-header paper-icon-button {
				width: 2.6rem;
				height: 2.6rem;
				margin-bottom: .25rem;
			}

			.top-bar {
				display: flex;
				justify-content: space-between;
				align-items: center;
				gap: 3rem;
			}

			.top-bar .actions {
				display: flex;
				justify-content: space-between;
				align-items: center;
				gap: 1rem;
				padding: 0 .5rem;
			}

			.loading-overlay {
				position: absolute;
				top: 0;
				left: 0;
				bottom: 0;
				right: 0;
				background-color: rgba(0, 0, 0, .75);
				display: flex;
				align-items: center;
				justify-content: center;
				z-index: 1000;
			}
		</style>

		<nuxeo-page>
			<div slot="header" class="page-header">
				AI Interactions Management
			</div>

			<div slot="tabs" class="top-bar">
				<paper-listbox id="documentViewsItems" selected="{{selectedTab}}" attr-for-selected="name">
					<nuxeo-page-item name="interactions" label="Interactions"></nuxeo-page-item>
					<nuxeo-page-item name="metadata" label="Metadata"></nuxeo-page-item>
					<nuxeo-page-item name="events" label="Events"></nuxeo-page-item>
					<nuxeo-page-item name="settings" label="Settings"></nuxeo-page-item>
				</paper-listbox>

				<div class="actions">
					<paper-button id="saveBtn" on-tap="_saveChanges" disabled$="[[ !_isDirty ]]" class="primary">
						Save changes
					</paper-button>

					<div>
						<paper-icon-button id="undoBtn" icon="icons:cancel" on-tap="_loadData"
										   disabled$="[[ !_isDirty ]]">
						</paper-icon-button>
						<nuxeo-tooltip for="undoBtn">
							Discard all changes
						</nuxeo-tooltip>
					</div>

					<div>
						<paper-icon-button id="refreshBtn" icon="icons:refresh" on-tap="_refresh"
										   disabled$="[[ _refreshing ]]">
						</paper-icon-button>
						<nuxeo-tooltip for="refreshBtn">
							Refresh interactions, metadata, events and settings
						</nuxeo-tooltip>
					</div>
				</div>
			</div>

			<iron-pages selected="[[selectedTab]]" attr-for-selected="name" selected-item="{{page}}">
				<cp-settings-interactions name="interactions" interactions="[[ interactions ]]"
										  document-types="[[ documentTypes ]]" changes-saved="[[ !_isDirty ]]">
				</cp-settings-interactions>

				<cp-settings-metadata name="metadata" interactions="[[ interactions ]]"
									  document-types="[[ documentTypes ]]">
				</cp-settings-metadata>

				<cp-settings-events name="events" interactions="[[ interactions ]]" document-types="[[ documentTypes ]]"
									events-settings="[[ eventsSettings ]]">
				</cp-settings-events>

				<cp-settings-vertesia name="settings" vertesia-settings="[[ vertesiaSettings ]]"
									  aws-s3-access-enabled="[[ awsS3AccessEnabled ]]">
				</cp-settings-vertesia>
			</iron-pages>

			<div class="loading-overlay" hidden$="[[ !_loading ]]">
				Loading...
			</div>
		</nuxeo-page>

		<nuxeo-operation id="getSettingsOperation" op="GetSettingsOperation"></nuxeo-operation>
		<nuxeo-operation id="docTypesOp" op="GetDocumentTypesOperation"></nuxeo-operation>
		<nuxeo-operation id="saveInteractionsOperation" op="SaveInteractionsOperation"></nuxeo-operation>
	</template>

	<script>
		Polymer({
			is: 'cp-settings',
			behaviors: [Nuxeo.LayoutBehavior, Nuxeo.ConfigurationBehaviour, Nuxeo.NotifyBehavior],
			properties: {
				selectedTab: {
					type: String,
					value: 'interactions'
				},
				page: Object,
				interactions: {
					type: Array,
					value: []
				},
				documentTypes: {
					type: Object,
					value: {}
				},
				eventsSettings: {
					type: Array,
					value: []
				},
				vertesiaSettings: {
					type: Object,
					value: {}
				},
				awsS3AccessEnabled: Boolean,
				visible: {
					type: Boolean,
					observer: '_visibleObserver'
				},
				_refreshing: Boolean,
				_isDirty: {
					type: Boolean,
					value: false
				},
				_saveChangesParams: {
					type: Object,
					value: {}
				},
				_loading: {
					type: Boolean,
					value: false
				}
			},

			attached()
			{
				this.addEventListener('mark-as-dirty', this._markAsDirty.bind(this));
			},

			detached()
			{
				this.removeEventListener('mark-as-dirty', this._markAsDirty);
			},

			_getInteractions()
			{
				const operation = this.$.getSettingsOperation;
				operation.params = {};

				return operation.execute()
					.then((response) =>
					{
						const { interactions, eventsSettings, vertesiaSettings, awsS3AccessEnabled } = response.value || {};
						if (interactions != null) {
							this.set('interactions', interactions);
						}
						if (eventsSettings != null) {
							this.set('eventsSettings', eventsSettings);
						}
						if (vertesiaSettings != null) {
							this.set('vertesiaSettings', vertesiaSettings);
						}
						if (awsS3AccessEnabled != null) {
							this.set('awsS3AccessEnabled', awsS3AccessEnabled);
						}
					})
					.catch((error) =>
					{
						console.error('Error triggering operation:', error);
					});
			},

			_getDocumentTypes()
			{
				const operation = this.$.docTypesOp;
				operation.params = {};

				return operation.execute()
					.then((response) =>
					{
						this.set('documentTypes', response.value);
					})
					.catch((error) =>
					{
						console.error('Error triggering operation:', error);
					});
			},

			_visibleObserver(visible)
			{
				if (visible)
					this._loadData();
			},

			_loadData()
			{
				this.set('_loading', true);

				setTimeout(() =>
				{
					Promise.all([
						this._getInteractions(),
						this._getDocumentTypes()
					])
						.then(() =>
						{
							this.set('_saveChangesParams', {});
							this.set('_isDirty', false);

							this.set('_loading', false);
						})
						.catch(() =>
						{
							this.set('_loading', false);
						});
				}, 100);
			},

			_refresh()
			{
				if (this._refreshing)
					return;

				this.set('_loading', true);

				this.notify({ message: 'Refreshing interactions, metadata, events and settings...', type: 'info' });
				this._refreshing = true;

				const operation = this.$.getSettingsOperation;
				operation.params = { 'refresh': true };
				operation.execute().then((response) =>
				{					
					this.set('interactions', response.value.interactions);

					this._refreshing = false;
					this.set('_loading', false);

					this.notify({ message: 'Successfully refreshed interactions, metadata, events and settings', type: 'success' });
				}).catch((error) =>
				{
					this._refreshing = false;
					this.set('_loading', false);

					console.error('Error triggering operation:', error);
				});
			},

			_saveChanges()
			{
				const operation = this.$.saveInteractionsOperation;

				operation.params = this._saveChangesParams;

				operation.execute()
					.then((response) =>
					{
						this.notify({ message: 'Changes Saved!', type: 'success' });

						this.set('_saveChangesParams', {});
						this.set('_isDirty', false);
					})
					.catch((error) =>
					{
						console.error('Error triggering operation:', error);
						this.notify({ message: 'Error saving changes!', type: 'error' });
					});
			},

			_markAsDirty(e)
			{
				if (e.detail.interactions)
					this._saveChangesParams.interactions = e.detail.interactions;

				if (e.detail.schemaSettings)
					this._saveChangesParams.schemaSettings = e.detail.schemaSettings;

				if (e.detail.eventsSettings)
					this._saveChangesParams.eventsSettings = e.detail.eventsSettings;

				if (e.detail.vertesiaSettings)
					this._saveChangesParams.vertesiaSettings = e.detail.vertesiaSettings;

				if (e.detail.awsS3AccessEnabled)
					this._saveChangesParams.awsS3AccessEnabled = e.detail.awsS3AccessEnabled;

				this.set('_isDirty', true);
			}
		});
	</script>
</dom-module>
