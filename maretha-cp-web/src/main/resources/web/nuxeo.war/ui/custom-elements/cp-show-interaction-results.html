<dom-module id="cp-show-interaction-results">
    <template>
        <nuxeo-operation id="getRelationsOp" op="Relations.GetRelations" input="[[document]]"
                         params='{"outgoing": "true", "predicate": "http://www.nuxeo.org/ecm/schemas/relation#isRelatedTo"}'>
        </nuxeo-operation>

        <style include="nuxeo-styles">
            :host {
              @apply --paper-card;
            }

            .related-documents {
              width: 95%;
              margin: auto;
            }
        </style>

        <div class="related-documents">
            <h3>Saved interactions</h3>
            <template is="dom-repeat" items="[[savedInteractions]]">
                <nuxeo-card role="widget" class="nuxeo-card" heading="[[item.name]]">
                    <cp-format-json-response string-json="[[item.response]]"></cp-format-json-response>
                    <nuxeo-date role="widget" datetime="[[item.createdAt]]" format="YYYY-MM-DD HH:mm:ss"
                                name="createdAt"></nuxeo-date>
                    <template is="dom-if" if="[[item.doc]]">
                        <p>Saved Interaction:
                            <a class="ellipsis" href$="[[urlFor(item.doc)]]" on-click="_navigate" target="_blank">[[item.doc.title]]</a>
                        </p>
                    </template>
                </nuxeo-card>
            </template>
        </div>

    </template>

    <script>
        Polymer({
          is: 'cp-show-interaction-results',
          behaviors: [Nuxeo.LayoutBehavior],
          properties: {
            document: {
              type: Object,
              observer: '_docObserver'
            },

            relatedDocuments: {
              type: Array,
              observer: '_relatedDocumentsObserver',
            },

            savedInteractions: {
              type: Array,
              value: [],
              observer: '_savedInteractionsObserver',
              notify: true
            },
          },

          ready() {
          },

          _getData() {
            this.set('savedInteractions', []);
            if (this.hasFacet(this.document, 'InteractionResultsFacet')) {
              this._fetchRelatedDocuments();
              this._addMetadataInteractions();
            }
          },

          _docObserver(doc) {
            if (!doc) return;
            this._getData();
            this.classList.add('iron-selected');
          },

          _savedInteractionsObserver(newVal) {
            if (!newVal || !Array.isArray(newVal)) {
              return;
            }
            this.savedInteractions.sort((a, b) => new Date(b.createdAt) - new Date(a.createdAt));
          },

          _fetchRelatedDocuments() {
            if (this.document) {
              this.$.getRelationsOp.execute()
                .then((response) => {
                  const documents = response.entries || [];
                  this.relatedDocuments = documents.filter(doc => (doc.type === 'InteractionResults' && doc.isTrashed === false));
                })
                .catch((error) => {
                  console.error('Error fetching related documents:', error);
                });
            }
          },

          _relatedDocumentsObserver: function (obs) {
            if (!this.relatedDocuments) return;
            const savedInteractions = this.savedInteractions || [];
            this.relatedDocuments.forEach(doc => {
              const interactions = doc.properties['interactionresults:interactions'];
              interactions.docId = doc.uuid;
              const interactionsWithDocId = interactions.map(interaction => ({
                ...interaction,
                doc: doc,
              }));
              savedInteractions.push(...interactionsWithDocId);
            });

            this.set('savedInteractions', []);
            this.set('savedInteractions', savedInteractions);
          },

          _addMetadataInteractions() {
            const savedInteractions = this.savedInteractions || [];
            const interactions = this.document.properties['interactionresults:interactions'];
            if (interactions) {
              this.savedInteractions.push(...interactions);
            }
            this.set('savedInteractions', []);
            this.set('savedInteractions', savedInteractions);
          },

        });
    </script>
</dom-module>
