<link rel="import" href="./cp-format-chat-json-response.html">

<dom-module id="cp-document-chat">
	<template>
		<style include="nuxeo-action-button-styles">
			::-webkit-scrollbar {
				height: 7px;
				width: 7px;
				background: #edeeef;
				box-shadow: none;
			}

			::-webkit-scrollbar-thumb {
				background: #cdcdcd;
				box-shadow: none;
			}

			:host {
				display: block;
				--paper-input-container-label_-_color: #999;
				--paper-input-container_-_padding: 0;
				--paper-button_-_padding: 0;
			}

			.chat {
				display: flex;
				flex-direction: column;
				border: 1px solid;
				border-color: rgba(58, 85, 17, .3);
				border-color: color-mix(in srgb, var(--nuxeo-button-primary) 5%, #000 18%);
				box-shadow: 0 0 3.5rem -2rem inset color-mix(in srgb, var(--nuxeo-button-primary) 50%, #000 50%);
				padding: 1rem;
				gap: 2rem;
				overflow: hidden;
				max-height: 459px;
				border-radius: .325rem;
				margin: .5rem 0;
			}

			.question {
				display: flex;
				align-items: center;
				gap: 1rem;
				margin: 0 0 0 1rem;
			}

			@media screen and (min-width: 1400px) {
				.question {
					padding: 0 max(20%, 200px);
				}
			}

			.input {
				flex-grow: 1;
				display: flex;
				gap: 1rem;
				flex-wrap: wrap;
			}

			.input paper-input {
				flex: 1 0 calc(50% - 1rem);
			}

			.chat-response {
				flex-grow: 1;
				background-color: color-mix(in srgb, var(--nuxeo-button-primary) 8%, #FFF 100%);
				box-shadow: 0 1rem 1.5rem -2.25rem;
				overflow: auto;
			}

			paper-icon-button {
				width: 3.5rem;
				height: 3.5rem;
				padding: .25rem;
				color: var(--nuxeo-button-primary);
			}
		</style>

		<div class="chat">
			<div class="chat-response">
				<cp-format-chat-json-response messages="[[chatContext]]" document="[[document]]"
					chat-interaction="[[chatInteraction]]" loading="[[loading]]">
				</cp-format-chat-json-response>
			</div>

			<div class="question">
				<div class="input">
					<template is="dom-repeat" items="[[chatInteraction.parameters]]" as="param">
						<paper-input role="widget" value="{{param.value}}" label="[[param.name]]"
							hidden="[[param.readOnly]]" readonly="[[param.readOnly]]" type="[[param.type]]"
							on-keydown="_keyPressed">
						</paper-input>

						<template is="dom-if" if="[[param.isContextMemoryParameter]]">
							<paper-input role="widget" value="{{_computeChatValue(param, interactionResponse)}}"
								label="[[param.name]]" hidden type="[[param.type]]">
							</paper-input>
						</template>
					</template>
				</div>

				<div>
					<paper-icon-button icon="custom-icons:ai-chat" on-tap="_interactWithDocument">
					</paper-icon-button>
					<nuxeo-tooltip>Ask question</nuxeo-tooltip>
				</div>
			</div>
		</div>

		<nuxeo-operation id="getSettingsOperation" op="GetInteractionsForDocumentOperation" input="[[document]]">
		</nuxeo-operation>

		<nuxeo-operation id="runInteractionOperation" op="RunInteractionOperation" input="[[document.uid]]">
		</nuxeo-operation>
	</template>

	<script>
		Polymer({
			is: 'cp-document-chat',
			behaviors: [Nuxeo.LayoutBehavior, Nuxeo.ConfigurationBehaviour],
			properties: {
				document: {
					type: Object
				},

				chatContext: {
					type: Array,
					value: [],
					notify: true
				},

				chatInteraction: {
					type: Object,
					value: null
				},

				interactionResponse: {
					type: String,
				},

				loading: {
					type: Boolean,
					value: false
				},

				_showButton: {
					type: Boolean,
					value: false
				}
			},

			observers: [
				'_documentChanged(document.*)',
				'_chatInteractionChanged(chatInteraction.*)'
			],

			_documentChanged(doc)
			{
				this.set('_showButton', !!this.chatInteraction);
			},

			_chatInteractionChanged(chatInteraction)
			{
				this.set('_showButton', !!chatInteraction);
			},

			ready()
			{
				const operation = this.$.getSettingsOperation;
				operation.params = { "isChat": true };

				operation.execute()
					.then((response) =>
					{
						if (response.value && response.value.length > 0)
						{
							this.set('chatInteraction', response.value[0]);

							this.fire('interaction-ready', this.chatInteraction);
						}
					})
					.catch((error) =>
					{
						console.error('Error triggering operation:', error);
					});
			},

			_keyPressed(e)
			{
				if (e.key === 'Enter' && !e.shiftKey && !e.ctrlKey)
					this._interactWithDocument();
			},

			_interactWithDocument()
			{
				if (!this.chatInteraction)
					return;

				this.set('interactionResponse', '');

				this._addParametersToChatContext();

				this.push('chatContext', {
					role: 'assistant',
					date: new Date().toISOString(),
					content: 'Waiting for AI response...'
				});

				const operation = this.$.runInteractionOperation;

				operation.params = {
					interactionId: this.chatInteraction.id,
					data: this.chatInteraction.parameters
				};

				this.set('loading', true);

				operation.execute()
					.then((response) =>
					{
						const index = this.chatContext.length - 1;

						this.chatContext[index].content = '';

						this._stream(response.value, index);
					})
					.catch((error) =>
					{
						console.error('Error triggering operation:', error);
						this.fire('notify', { message: error });
					});
			},

			_addParametersToChatContext()
			{
				this.chatInteraction.parameters.forEach((param) =>
				{
					if (param.isContextMemoryParameter)
						return;

					if (param.type === 'string')
						this.push('chatContext', {
							role: 'user',
							param: param.name,
							content: param.value,
							date: new Date().toISOString()
						});
				});
			},

			_stream(url, index)
			{
				const eventSource = new EventSource(url);

				eventSource.onmessage = (event) =>
				{
					this.chatContext[index].content += event.data.slice(1, -1);
					this.notifyPath(`chatContext.${index}.content`);
				};

				eventSource.onerror = (event) =>
				{
					this.chatContext[index].content = 'Failed to get response. Please try again.';
					this.notifyPath(`chatContext.${index}.content`);

					this.set('loading', false);
				}

				eventSource.addEventListener('close', (event) =>
				{
					this.set('interactionResponse', this.chatContext[index].content);

					const closeObject = JSON.parse(event.data);

					if (closeObject.error)
					{
						this.chatContext[index].content = closeObject.error.message;
						this.notifyPath(`chatContext.${index}.content`);
					}

					eventSource.close();

					this.set('loading', false);
				});
			},

			_computeChatValue(contextParam, interactionResponse)
			{
				contextParam.value = JSON.stringify(this.chatContext);

				return contextParam.value;
			}
		});
	</script>
</dom-module>
