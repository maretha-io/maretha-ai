<dom-module id="cp-save-response">
  <template>

    <nuxeo-operation id="saveResponse" op="SaveInteractionResponseOperation" input="[[document]]"
      sync-indexing="true"></nuxeo-operation>

    <style include="nuxeo-action-button-styles">
      .button-container {
        display: block;
        margin: auto;
      }

      :host {
        display: block;
        margin: auto;
      }

      /* Base button styles for both buttons */
      paper-button {
        background-color: #e0f7fa;
        /* Light cyan background */
        color: #00796b;
        /* Dark teal text */
        font-size: 9px;
        text-transform: uppercase;
        transition: background-color 0.3s ease;
      }

      /* Slightly different background color for hover effect */
      paper-button:hover {
        background-color: #b2ebf2;
      }

      /* Make buttons slightly more distinct but still light */
      .save-metadata {
        background-color: #6676b0;
        color: #ffffff;
      }

      .save-related {
        background-color: #b8c0ff;
        color: #393939;
      }

      /* Hover effect for the Save as Metadata button */
      .save-metadata:hover {
        background-color: #dcedc8;
        /* Slightly darker green */
      }

      /* Hover effect for Save as Related Document */
      .save-related:hover {
        background-color: #b2ebf2;
        /* Slightly darker cyan */
      }
    </style>

    <div class="button-container">
      <paper-button id="save" class="save-metadata" on-tap="_saveAsMetadata" aria-label="Save as Metadata" raised>
        Save as Metadata
        <iron-icon icon="icons:save"></iron-icon>
      </paper-button>
      <paper-button id="saveAsDocument" class="save-related" on-tap="_saveAsRelatedDocument" aria-label="Save as Document" raised>
        Save as Document
        <iron-icon icon="icons:save"></iron-icon>
      </paper-button>
    </div>

    <p id="toast"></p>

  </template>

  <script>
    Polymer({
      is: 'cp-save-response',
      behaviors: [Nuxeo.LayoutBehavior, Nuxeo.ConfigurationBehaviour],
      properties: {

        document: {
          type: Object,
          observer: '_documentObserver',
        },

        interaction: {
          type: Object,
          observer: '_interactionObserver',
        },

        interactionResponse: {
          type: String,
          observer: '_interactionObserver',
        },

        debugging: {
          type: Boolean,
          value: false
        },

      },

      observers: [],

      _interactionObserver(obs) {
        this._debug(`_interactionObserver:`, obs);
        this.$.toast.innerText = '';
      },

      _documentObserver(obs) {
        this._debug(`_documentObserver:`, obs);
        this.$.toast.innerText = '';
      },

      _saveAsMetadata() {
        this.$.saveResponse.params.saveOnMetadata = true;
        this._saveInteractionResponse();
      },

      _saveAsRelatedDocument() {
        this.$.saveResponse.params.saveOnMetadata = false;
        this._saveInteractionResponse();
      },

      _saveInteractionResponse(e) {
        if (!this.interactionResponse) {
          this.fire('notify', { message: 'Cannot save without a response.' });
          console.error('Cannot save without a response.');
          this._toast("Cannot save without a response.");
          return;
        }
        this.$.saveResponse.params.interactions = [{
          "id": this.document.uid + '-' + this.interaction.id + '-' + new Date().toISOString(),
          "interactionId": this.interaction.id,
          "documentId": this.document.uid,
          "response": this.interactionResponse,
          "name": this.interaction.name,
          "status": this.interaction.status,
          "createdAt": new Date().toISOString(),
          "createdBy": this._getUser(),
          "parameters": this.interaction.parameters
        }];
        this.$.saveResponse.execute().then((response) => {
          this.fire('notify', { message: 'Response Saved!' });
          this._toast("Response Saved!");
        }).catch((error) => {
          console.error(error);
          this.fire('notify', { message: 'error' });
          this._toast("Failed to save response.");
        })
      },

      _toast: function (text) {
          this.$.toast.innerText = text;
      },

      _getUser: function () {
        const app = document.querySelector('nuxeo-app');
        return app.currentUser.id;
      },

      _debug: function (name, info) {
        if (this.debugging) {
          console.log(name, info);
        }
      }

    });
  </script>
</dom-module>
