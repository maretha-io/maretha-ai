<dom-module id="cp-save-response">
  <template>

    <nuxeo-operation id="saveResponse" op="SaveInteractionResponseOperation" input="[[document]]"
      sync-indexing="true"></nuxeo-operation>

    <style include="nuxeo-action-button-styles">
      /* Flexbox container for the buttons */
      .button-container {
        display: flex;
        gap: 16px; /* Spacing between the buttons */
      }

      /* Base button styles for both buttons */
      paper-button {
        background-color: #e0f7fa; /* Light cyan background */
        color: #00796b; /* Dark teal text */
        border-radius: 4px;
        padding: 10px 16px;
        font-size: 14px;
        font-weight: bold;
        text-transform: uppercase;
        transition: background-color 0.3s ease;
      }

      /* Slightly different background color for hover effect */
      paper-button:hover {
        background-color: #b2ebf2;
      }

      /* Make buttons slightly more distinct but still light */
      paper-button.save-metadata {
        background-color: #f1f8e9; /* Light green background */
        color: #558b2f; /* Olive text */
      }

      paper-button.save-related {
        background-color: #e0f7fa; /* Light cyan background */
        color: #00796b; /* Dark teal text */
      }

      /* Hover effect for the Save as Metadata button */
      paper-button.save-metadata:hover {
        background-color: #dcedc8; /* Slightly darker green */
      }

      /* Hover effect for Save as Related Document */
      paper-button.save-related:hover {
        background-color: #b2ebf2; /* Slightly darker cyan */
      }
    </style>

    <div class="button-container">
      <paper-button raised class="save-metadata" on-click="_saveAsMetadata">Save as Metadata</paper-button>
      <paper-button raised class="save-related" on-click="_saveAsRelatedDocument">Save as Related Document</paper-button>
    </div>

  </template>

  <script>
    Polymer({
      is: 'cp-save-response',
      behaviors: [Nuxeo.LayoutBehavior, Nuxeo.ConfigurationBehaviour],
      properties: {

        document: {
          type: Object,
          observer: '_documentObserver',
        },

        interaction: {
          type: Object,
          observer: '_interactionObserver',
        },

        interactionResponse: {
          type: Object,
          observer: '_interactionObserver',
        },

      },

      observers: [],

      _interactionObserver: (obs) => {
        console.log(`_interactionsObserver:`, obs);
      },

      _documentObserver: (obs) => {
        console.log(`_documentObserver:`, obs);
      },

      _saveAsMetadata() {
        console.log('_saveAsMetadata');
        this.$.saveResponse.params.saveOnMetadata = true;
        this._saveInteractionResponse();
      },

      _saveAsRelatedDocument() {
        console.log('_saveAsRelatedDocument');
        this.$.saveResponse.params.saveOnMetadata = false;
        this._saveInteractionResponse();
      },

      _saveInteractionResponse(e) {
        if(!this.interactionResponse) {
          this.fire('notify', 'Cannot save without a response.', {close: true});
          return;
        }
        this.$.saveResponse.params.interactions =  [{
          "id": "random-id",
          "interactionId": this.interaction.id,
          "documentId": this.document.uid,
          "response": this.interactionResponse,
          "name": "name",
          "status": "status",
          "createdAt": Date.now(),
          "createdBy": "user",
          "parameters": this.interaction.parameters
        }];
        this.$.saveResponse.execute().then((response) => {
          console.log("document saved");
          this.fire('notify', { message: 'Document Updated' });
        }).catch((error) => {
          console.log(error);
          this.notify(error);
        })
      },

    });
  </script>
</dom-module>
