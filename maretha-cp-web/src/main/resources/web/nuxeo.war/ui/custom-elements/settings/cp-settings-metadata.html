<dom-module id="cp-settings-metadata">
	<template>
		<style include="nuxeo-styles">
			::-webkit-scrollbar {
				height: 7px;
				width: 7px;
				background: #edeeef;
				box-shadow: none;
			}

			::-webkit-scrollbar-thumb {
				background: #cdcdcd;
				box-shadow: none;
			}

			:host {
				--paper-checkbox-checked-color: var(--nx-button-primary_-_background-color);
				--nuxeo-tag_-_font-size: 0.85rem;
				--nuxeo-tag_-_line-height: 1.6;

				--paper-item-selected: {
					border-left: 4px solid var(--nx-button-primary_-_background-color);
				}
			}

			nuxeo-card {
				--nuxeo-card_-_margin-bottom: 0;
				height: calc(100vh - 14.5rem);
			}

			.flex {
				display: flex;
				gap: 1rem;
				height: 100%;
			}

			nuxeo-data-table {
				flex-grow: 1;
				box-shadow: 0 0 3px -1px rgba(0, 0, 0, .5);
			}

			.xpath {
				display: flex;
				flex-direction: column;
				align-items: start;
				line-height: 1.3;
			}

			.xpath small {
				color: #888;
			}

			paper-listbox {
				overflow: auto;
				box-shadow: 0 0 3px -1px rgba(0, 0, 0, .5);
				padding: 1rem;
				margin: 0;
			}

			#interactionsDropdown {
				position: fixed;
				z-index: 10000;
				display: none;
			}

			.dropdown-trigger {
				position: relative;
				width: 100%;
			}

			.dropdown-trigger paper-input {
				width: 100%;
			}

			paper-item {
				cursor: pointer;
			}

			.table-container {
				overflow: auto;
				box-shadow: 0 0 3px -1px rgba(0, 0, 0, .5);
				padding: 1rem;
				margin: 0;
				flex-grow: 1;
			}

			table {
				border-collapse: collapse;
				border-spacing: 0;
				width: 100%;
			}

			table thead tr,
			table tbody tr {
				border-bottom: var(--iron-data-table-row_-_border-bottom, 1px solid var(--nuxeo-border, #e3e3e3));
			}

			table thead tr th {
				background-color: var(--iron-data-table-header_-_background-color);
				color: var(--iron-data-table-header_-_color);
				padding: 8px 24px;
				text-align: left;
			}

			table tbody tr td {
				padding: 8px 24px;
				text-align: left;
			}

			table thead tr th:nth-of-type(1),
			table tboddy tr td:nth-of-type(1) {
				width: 7%;
			}

			table thead tr th:nth-of-type(2),
			table thead tr th:nth-of-type(3),
			table tbody tr td:nth-of-type(2),
			table tbody tr td:nth-of-type(3) {
				text-align: center;
				width: 7%;
			}

			table tbody tr td nuxeo-document-suggestion {
				margin-bottom: -1rem;
			}

			table tbody tr td paper-input {
				margin-bottom: 1rem;
			}
		</style>

		<nuxeo-card>
			<div class="flex">
				<paper-listbox id="dropdownListboxDocType" selected="{{selectedDocTypeIndex}}">
					<template is="dom-repeat" items="[[documentTypes]]">
						<paper-item>[[item]]</paper-item>
					</template>
				</paper-listbox>

				<template is="dom-if" if="[[ documentTypeWithSchema ]]">
					<paper-listbox id="dropdownListboxSchema" selected="{{selectedSchemaIndex}}">
						<template is="dom-repeat" items="[[documentTypeWithSchema.schemas]]">
							<paper-item>[[item.name]]</paper-item>
						</template>
					</paper-listbox>
				</template>

				<template id="tableDom" is="dom-if" if="[[selectedSchema]]">
					<div class="table-container">
						<table>
							<thead>
								<tr>
									<th>Xpath</th>
									<th>Active</th>
									<th>Context</th>
									<th>Isolated</th>
									<th>Interaction</th>
									<th>Description</th>
								</tr>
							</thead>

							<tbody>
								<template is="dom-repeat" items="[[ selectedSchema.fields ]]">
									<tr>
										<td>
											<div class="xpath">
												<span>[[item.xpath]]</span>

												<template is="dom-if" if="[[ item.directoryName ]]">
													<nuxeo-tag>[[ item.directoryName ]]</nuxeo-tag>
												</template>

												<template is="dom-if" if="[[ !item.directoryName ]]">
													<small>[[item.type]]</small>
												</template>
											</div>
										</td>

										<td>
											<paper-checkbox checked="{{ item.active }}" on-change="_markAsDirty" />
										</td>

										<td>
											<paper-checkbox checked="{{ item.additionalContext }}" on-change="_markAsDirty" />
										</td>

										<td>
											<paper-checkbox checked="{{ item.inIsolation }}"
												on-change="_inIsolationChanged" data-index$="[[index]]" />
										</td>

										<td>
											<template is="dom-if" if="[[item.inIsolation]]" restamp>
												<cp-selectivity value="{{ item.interactionId }}"
													data="[[ filteredInteractions ]]"
													on-selection-changed="_markAsDirty"
													id-function="[[ _interactionIdFunction ]]"
													result-formatter="[[ _interactionResultFormatter ]]"
													selection-formatter="[[ _interactionResultFormatter ]]">
												</cp-selectivity>
											</template>
										</td>

										<td>
											<paper-input type="[[item.type]]" value="{{item.description}}"
												on-input="_markAsDirty">
											</paper-input>
										</td>
									</tr>
								</template>
							</tbody>
						</table>
					</div>
				</template>
			</div>
		</nuxeo-card>

		<nuxeo-operation id="docTypesOp" op="GetDocumentTypesOperation"></nuxeo-operation>

	</template>

	<script>
		Polymer({
			is: 'cp-settings-metadata',
			behaviors: [Nuxeo.LayoutBehavior, Nuxeo.ConfigurationBehaviour],
			properties: {
				interactions: {
					type: Array,
					value: [],
					notify: true
				},

				documentTypes: {
					type: Array,
					value: []
				},

				documentTypeWithSchema: Object,

				schemaSettings: {
					type: Object,
					observer: '_schemaSettingsObserver'
				},

				selectedDocTypeIndex: {
					type: Number,
					value: -1,
					observer: '_selectedDocTypeIndexObserver'
				},

				selectedSchemaIndex: {
					type: Number,
					value: -1,
					observer: '_selectedSchemaIndexObserver'
				},

				selectedSchema: Object,

				interactions: {
					type: Array,
					value: [],
				},

				filteredInteractions: {
					type: Array,
					computed: '_filterInteractions(interactions)',
				}
			},

			observers: [
				'_selectedSchemaChanged(selectedSchema.*)',
				'_documentTypesChanged(documentTypes.splices)'
			],

			_interactionIdFunction(e)
			{
				return e ? e.id : '';
			},

			_interactionResultFormatter(e)
			{
				return e ? e.name : '?';
			},

			_getDocumentTypeWithSchema()
			{
				const operation = this.$.docTypesOp;
				operation.params = { "withSchemas": true, "documentType": this.documentTypes[this.selectedDocTypeIndex] };

				return operation.execute()
					.then((response) =>
					{
						this.set('documentTypeWithSchema', response.value[0]);

						this.set('selectedSchemaIndex', -1);
						this.set('selectedSchema', undefined);
					})
					.catch((error) =>
					{
						console.error('Error triggering operation:', error);
					});
			},

			_selectedDocTypeIndexObserver(selectedDocTypeIndex)
			{
				if (selectedDocTypeIndex > -1)
					this._getDocumentTypeWithSchema();
			},

			_selectedSchemaIndexObserver(selectedSchemaIndex)
			{
				if (selectedSchemaIndex > -1)
					{
						const documentTypeWithSchema = this.documentTypeWithSchema;
						const selectedSchema = documentTypeWithSchema.schemas[selectedSchemaIndex];
						selectedSchema.docType = documentTypeWithSchema.name; //assign docType
						this.set('selectedSchema', selectedSchema);
					}
			},

			_filterInteractions(interactions)
			{
				return interactions.filter(x => x.saveMetadata);
			},

			_onInteractionChanged(e)
			{
				if (this.currentEditingItem && e.detail && e.detail.value)
				{
					const selectedId = e.detail.value;
					this.set('currentEditingItem.interactionId', selectedId);
				}
			},

			//Forces table data update
			_renderTable()
			{
				const schemas = this.documentTypeWithSchema.schemas;

				if (!schemas || schemas.length === 0)
				{
					console.warn('No schemas available');
					return;
				}

				const firstIndex = 0;
				const lastIndex = schemas.length - 1;

				const selectedSchemaIndex = this.selectedSchemaIndex;
				this.set('selectedSchemaIndex', firstIndex);
				this.set('selectedSchemaIndex', lastIndex);
				this.set('selectedSchemaIndex', selectedSchemaIndex);
			},

			_selectedSchemaChanged(e)
			{
				this.$.tableDom.render();
			},

			_documentTypesChanged()
			{
				if (this.selectedDocTypeIndex < 0)
					return;

				const selectedSchemaIndex = this.selectedSchemaIndex;

				this._getDocumentTypeWithSchema().then(() =>
				{
					this.selectedSchemaIndex = selectedSchemaIndex;

					this._renderTable();
				});
			},

			_markAsDirty()
			{
				this.fire('mark-as-dirty', { schemaSettings: this.selectedSchema });
			},

			_inIsolationChanged(e)
			{
				this._markAsDirty();

				// Force Polymer to re-evaluate the second column's dom-if
				this.notifyPath(`selectedSchema.fields.${e.target.dataset.index}.inIsolation`);
			}
		});
	</script>
</dom-module>
