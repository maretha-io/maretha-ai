<dom-module id="cp-settings-vertesia">
	<template>
		<style include="nuxeo-styles">
			.content {
				display: flex;
				flex-direction: column;
				gap: 1rem;
			}

			paper-toggle-button {
				cursor: pointer;
			}
		</style>

		<div id="main slot">

			<nuxeo-card heading="General settings">
				<paper-toggle-button checked="{{awsS3AccessEnabled}}" on-change="_saveAws">
					Enable AWS S3 Path
				</paper-toggle-button>
			</nuxeo-card>

			<nuxeo-card heading="Vertesia settings">
				<div class="content">
					<nuxeo-input role="widget" value="{{vertesiaSettings.apiUrl}}" label="apiUrl" type="text"
						on-input="_markAsDirty">
					</nuxeo-input>

					<nuxeo-input role="widget" value="{{vertesiaSettings.uploadUrl}}" label="uploadUrl" type="text"
						on-input="_markAsDirty">
					</nuxeo-input>

					<nuxeo-input role="widget" value="{{vertesiaSettings.authToken}}" label="authToken" type="text"
						on-input="_markAsDirty">
					</nuxeo-input>

					<nuxeo-input role="widget" value="{{vertesiaSettings.projectId}}" label="projectId" type="text"
						on-input="_markAsDirty">
					</nuxeo-input>

					<nuxeo-input role="widget" value="{{vertesiaSettings.environmentId}}" label="environmentId"
						type="text" on-input="_markAsDirty">
					</nuxeo-input>

					<nuxeo-input role="widget" value="{{vertesiaSettings.embeddingModel}}" label="embeddingModel"
						type="text" on-input="_markAsDirty">
					</nuxeo-input>

					<nuxeo-input role="widget" value="{{vertesiaSettings.mimeTypes}}" label="mimeTypes" type="text"
						on-input="_markAsDirty">
					</nuxeo-input>

					<nuxeo-input role="widget" value="{{vertesiaSettings.directoryBucketSize}}" label="directoryBucketSize" type="number"
								 min="0"
								 step="10"
								 on-input="_markAsDirty">
					</nuxeo-input>

					<nuxeo-input role="widget" value="{{vertesiaSettings.callbackNotifyUrl}}" label="callbackNotifyUrl" type="text"
								 on-input="_markAsDirty">
					</nuxeo-input>

					<nuxeo-input role="widget" value="{{vertesiaSettings.fileTypeId}}" label="fileTypeId" type="text"
								 on-input="_markAsDirty">
					</nuxeo-input>
				</div>
			</nuxeo-card>

			<nuxeo-card>
				<h3>Elasticsearch Query Settings</h3>
				<paper-toast id="toast"></paper-toast>

				<div class="content">

					<nuxeo-input role="widget" value="{{esSettings.BOOST}}"
								 label="BOOST" type="text"
								 placeholder="" on-change="_markAsDirty"></nuxeo-input>
					<nuxeo-input role="widget" value="{{esSettings.TEXT_WEIGHT}}"
								 label="TEXT_WEIGHT" type="text"
								 placeholder=""  on-change="_markAsDirty"></nuxeo-input>
					<nuxeo-input role="widget" value="{{esSettings.IMAGE_WEIGHT}}"
								 label="IMAGE_WEIGHT" type="text"
								 placeholder=""  on-change="_markAsDirty"></nuxeo-input>
					<nuxeo-input role="widget" value="{{esSettings.SCORE_MODE}}"
								 label="SCORE_MODE" type="text"
								 placeholder=""  on-change="_markAsDirty"></nuxeo-input>
					<nuxeo-input role="widget" value="{{esSettings.BOOST_MODE}}"
								 label="BOOST_MODE" type="text"
								 placeholder="" on-change="_markAsDirty"></nuxeo-input>

				</div>
			</nuxeo-card>
		</div>
	</template>

	<script>
		Polymer({
			is: 'cp-settings-vertesia',
			behaviors: [Nuxeo.LayoutBehavior, Nuxeo.ConfigurationBehaviour],
			properties: {
				vertesiaSettings: {
					type: Object,
					value: {}
				},

				esSettings: {
					type: Object,
					value: {}
				},

				awsS3AccessEnabled: Boolean
			},

			_saveAws()
			{
				this.fire('mark-as-dirty', { awsS3AccessEnabled: this.awsS3AccessEnabled });
			},

			_markAsDirty()
			{
				this.fire('mark-as-dirty', { vertesiaSettings: this.vertesiaSettings, esSettings: this.esSettings });
			}
		});
	</script>
</dom-module>
