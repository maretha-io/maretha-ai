<dom-module id="cp-settings-metadata">
	<template>
		<style include="nuxeo-styles">
			::-webkit-scrollbar {
				height: 7px;
				width: 7px;
				background: #edeeef;
				box-shadow: none;
			}

			::-webkit-scrollbar-thumb {
				background: #cdcdcd;
				box-shadow: none;
			}

			:host {
				--paper-checkbox-checked-color: var(--nx-button-primary_-_background-color);
				--nuxeo-tag_-_font-size: 0.85rem;
				--nuxeo-tag_-_line-height: 1.6;

				--paper-item-selected: {
					border-left: 4px solid var(--nx-button-primary_-_background-color);
				}
			}

			nuxeo-card {
				--nuxeo-card_-_margin-bottom: 0;
				height: calc(100vh - 14.5rem);
			}

			.flex {
				display: flex;
				gap: 1rem;
				height: 100%;
			}

			nuxeo-data-table {
				flex-grow: 1;
				box-shadow: 0 0 3px -1px rgba(0, 0, 0, .5);
			}

			.xpath {
				display: flex;
				flex-direction: column;
				align-items: start;
				line-height: 1.3;
			}

			.xpath small {
				color: #888;
			}

			paper-listbox {
				overflow: auto;
				box-shadow: 0 0 3px -1px rgba(0, 0, 0, .5);
				padding: 1rem;
				margin: 0;
			}

			nuxeo-data-table-cell {
				min-width: 0 !important;
			}

			nuxeo-data-table-cell:nth-of-type(2),
			nuxeo-data-table-cell:nth-of-type(3) {
				justify-content: center;
				text-align: center;
			}

			nuxeo-data-table-cell paper-input {
				width: 100%;
			}

			#interactionsDropdown {
				position: fixed;
				z-index: 10000;
				display: none;
			}

			.dropdown-trigger {
				position: relative;
				width: 100%;
			}

			.dropdown-trigger paper-input {
				width: 100%;
			}

			paper-item {
				cursor: pointer;
			}
		</style>

		<nuxeo-card>
			<div class="flex">
				<paper-listbox id="dropdownListboxDocType" selected="{{selectedDocTypeIndex}}">
					<template is="dom-repeat" items="[[documentTypes]]">
						<paper-item>[[item]]</paper-item>
					</template>
				</paper-listbox>

				<template is="dom-if" if="[[ documentTypeWithSchema ]]">
					<paper-listbox id="dropdownListboxSchema" selected="{{selectedSchemaIndex}}">
						<template is="dom-repeat" items="[[documentTypeWithSchema.schemas]]">
							<paper-item>[[item.name]]</paper-item>
						</template>
					</paper-listbox>
				</template>

				<template id="tableDom" is="dom-if" if="[[selectedSchema]]">
					<nuxeo-data-table id="table" items="{{selectedSchema.fields}}" class="results-table">
						<nuxeo-data-table-column name="Xpath" flex="1">
							<template>
								<div class="xpath">
									<span>[[item.xpath]]</span>

									<template is="dom-if" if="[[ item.directoryName ]]">
										<nuxeo-tag>[[ item.directoryName ]]</nuxeo-tag>
									</template>

									<template is="dom-if" if="[[ !item.directoryName ]]">
										<small>[[item.type]]</small>
									</template>
								</div>
							</template>
						</nuxeo-data-table-column>

						<nuxeo-data-table-column name="Active" flex="0">
							<template>
								<paper-checkbox checked="{{ item.active }}" on-change="_markAsDirty" />
							</template>
						</nuxeo-data-table-column>

						<nuxeo-data-table-column name="Isolated" flex="0">
							<template>
								<paper-checkbox checked="{{ item.inIsolation }}" on-change="_inIsolationChanged" />
							</template>
						</nuxeo-data-table-column>

						<nuxeo-data-table-column name="Interaction" flex="2">
							<template>
								<template is="dom-if" if="[[item.inIsolation]]">
									<div class="dropdown-trigger" on-tap="_showInteractionDropdown">
										<paper-ripple></paper-ripple>
										<paper-input type="text" readonly
											value="[[_getInteractionName(item.interactionId, interactions)]]"
											placeholder="Select an interaction" autocomplete="off"
											data-selected-schema-field-index$="[[ index ]]">
											<iron-icon icon="paper-dropdown-menu:arrow-drop-down" suffix
												slot="suffix"></iron-icon>
										</paper-input>
									</div>
								</template>
							</template>
						</nuxeo-data-table-column>

						<nuxeo-data-table-column name="Description" flex="2">
							<template>
								<paper-input type="[[item.type]]" value="{{item.description}}" on-input="_markAsDirty">
								</paper-input>
							</template>
						</nuxeo-data-table-column>
					</nuxeo-data-table>
				</template>

				<paper-menu-button id="interactionsDropdown" opened="{{_interactionsDropdownVisible}}"
					on-iron-select="_onIronSelect" close-on-activate allow-outside-scroll>
					<paper-listbox selected="{{ _selectedInteraction }}" slot="dropdown-content"
						attr-for-selected="data-id">
						<template is="dom-repeat" items="[[filteredInteractions]]">
							<paper-item data-id="[[item.id]]">[[item.name]]</paper-item>
						</template>
					</paper-listbox>
				</paper-menu-button>
			</div>
		</nuxeo-card>

		<nuxeo-operation id="docTypesOp" op="GetDocumentTypesOperation"></nuxeo-operation>

	</template>

	<script>
		Polymer({
			is: 'cp-settings-metadata',
			behaviors: [Nuxeo.LayoutBehavior, Nuxeo.ConfigurationBehaviour],
			properties: {
				interactions: {
					type: Array,
					value: [],
					notify: true
				},

				documentTypes: {
					type: Array,
					value: []
				},

				documentTypeWithSchema: Object,

				schemaSettings: {
					type: Object,
					observer: '_schemaSettingsObserver'
				},

				selectedDocTypeIndex: {
					type: Number,
					value: -1,
					observer: '_selectedDocTypeIndexObserver'
				},

				selectedSchemaIndex: {
					type: Number,
					value: -1,
					observer: '_selectedSchemaIndexObserver'
				},

				selectedSchema: Object,

				interactions: {
					type: Array,
					value: [],
				},

				filteredInteractions: {
					type: Array,
					computed: '_filterInteractions(interactions)',
				},

				_selectedSchemaFieldIndex: Number,
				_selectedInteraction: Object,
				_interactionsDropdownVisible: Boolean
			},

			observers: [
				'_selectedSchemaChanged(selectedSchema.*)',
				'_documentTypesChanged(documentTypes.splices)'
			],

			_getDocumentTypeWithSchema()
			{
				const operation = this.$.docTypesOp;
				operation.params = { "withSchemas": true, "documentType": this.documentTypes[this.selectedDocTypeIndex] };

				return operation.execute()
					.then((response) =>
					{
						this.set('documentTypeWithSchema', response.value[0]);

						this.set('selectedSchemaIndex', -1);
						this.set('selectedSchema', undefined);
					})
					.catch((error) =>
					{
						console.error('Error triggering operation:', error);
					});
			},

			_selectedDocTypeIndexObserver(selectedDocTypeIndex)
			{
				if (selectedDocTypeIndex > -1)
					this._getDocumentTypeWithSchema();
			},

			_selectedSchemaIndexObserver(selectedSchemaIndex)
			{
				if (selectedSchemaIndex > -1)
					this.set('selectedSchema', this.documentTypeWithSchema.schemas[selectedSchemaIndex]);
			},

			_filterInteractions(interactions)
			{
				return interactions.filter(x => x.saveMetadata);
			},

			_onInteractionChanged(e)
			{
				if (this.currentEditingItem && e.detail && e.detail.value)
				{
					const selectedId = e.detail.value;
					this.set('currentEditingItem.interactionId', selectedId);
				}
			},

			//Forces table data update
			_renderTable()
			{
				const schemas = this.documentTypeWithSchema.schemas;

				if (!schemas || schemas.length === 0)
				{
					console.warn('No schemas available');
					return;
				}

				const firstIndex = 0;
				const lastIndex = schemas.length - 1;

				const selectedSchemaIndex = this.selectedSchemaIndex;
				this.set('selectedSchemaIndex', firstIndex);
				this.set('selectedSchemaIndex', lastIndex);
				this.set('selectedSchemaIndex', selectedSchemaIndex);
			},

			_selectedSchemaChanged()
			{
				this.$.tableDom.render();
			},

			_documentTypesChanged()
			{
				if (this.selectedDocTypeIndex < 0)
					return;

				const selectedSchemaIndex = this.selectedSchemaIndex;

				this._getDocumentTypeWithSchema().then(() =>
				{
					this.selectedSchemaIndex = selectedSchemaIndex;

					this._renderTable();
				});
			},

			_getInteractionName(interactionId, interactions)
			{
				if (!interactionId || !interactions)
					return '';

				const match = interactions.find(interaction => interaction.id === interactionId);
				return match ? match.name : '';
			},

			_markAsDirty(e)
			{
				this.fire('mark-as-dirty', { schemaSettings: this.selectedSchema });
			},

			_inIsolationChanged()
			{
				this._markAsDirty();

				this._renderTable();
			},

			_showInteractionDropdown(e)
			{
				this._selectedSchemaFieldIndex = e.target.dataset.selectedSchemaFieldIndex;

				if (!this._interactionsDropdownVisible)
				{
					this.set('_selectedInteraction', this.selectedSchema.fields[this._selectedSchemaFieldIndex].interactionId);

					const clientRect = e.currentTarget.getBoundingClientRect();
					this.$.interactionsDropdown.style.top = `${clientRect.top}px`;
					this.$.interactionsDropdown.style.left = `${clientRect.left}px`;
					this.$.interactionsDropdown.style.display = 'block';

					this.set('_interactionsDropdownVisible', true);
				}
				else
					this.set('_interactionsDropdownVisible', false);
			},

			_onIronSelect(e)
			{
				this.set(`selectedSchema.fields.${this._selectedSchemaFieldIndex}.interactionId`, e.detail.item.dataId);

				this._markAsDirty();
			}
		});
	</script>
</dom-module>
