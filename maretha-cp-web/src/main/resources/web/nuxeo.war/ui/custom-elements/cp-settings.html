<dom-module id="cp-settings">
  <template>
    <nuxeo-operation id="getInteractionsOperation" op="GetInteractionsOperation" ></nuxeo-operation>
    <nuxeo-operation id="saveInteractionsOperation" op="SaveInteractionsOperation" ></nuxeo-operation>
    <nuxeo-operation id="docTypesOp" op="GetDocumentTypesOperation" ></nuxeo-operation>

    <style include="nuxeo-styles">
      .content {
        width: 100%;
      }

      paper-checkbox {
        padding: 10px;
        width: 50%;
      }

      paper-toggle-button {
        --paper-toggle-button-checked-bar-color: var(--paper-green-500);
        --paper-toggle-button-checked-button-color: var(--paper-green-500);
        --paper-toggle-button-checked-ink-color: var(--paper-green-500);
        --paper-toggle-button-unchecked-bar-color: var(--paper-red-500);
        --paper-toggle-button-unchecked-button-color: var(--paper-red-500);
        --paper-toggle-button-unchecked-ink-color: var(--paper-red-500);
      }

      .toast-error {
        background-color: #f44336; /* Red */
        color: white;
      }

      .toast-success {
        background-color: #4caf50; /* Green */
        color: white;
      }

      .toast-warning {
        background-color: #ff9800; /* Orange */
        color: white;
      }

      .table {
        width: 100%;
      }

      #dialog {
        width: 80%;
        min-height: 50%;
        margin: auto;
      }
    </style>

    <nuxeo-page>
      <div slot="header">
        <span>AI Interactions Management</span>
      </div>
      <div id="main slot">
        <paper-toast id="toast"></paper-toast>

        <nuxeo-card>
          <div class="content">
            <nuxeo-data-table items="[[interactions]]" class="results-table">
              <nuxeo-data-table-column name="Name">
                <template>
                  <a href="https://cloud.becomposable.com/studio/interactions/{{interaction.id}}"
                     target="_blank">{{item.name}}</a>
                </template>
              </nuxeo-data-table-column>

              <nuxeo-data-table-column name="Description">
                <template>
                  [[item.description]]
                </template>
              </nuxeo-data-table-column>

              <nuxeo-data-table-column name="Active">
                <template>
                  <paper-toggle-button checked="{{item.active}}">Active</paper-toggle-button>
                </template>
              </nuxeo-data-table-column>

              <nuxeo-data-table-column name="Status">
                <template>
                  status
                </template>
              </nuxeo-data-table-column>

              <nuxeo-data-table-column name="Configuration">
                <template>
                  <paper-icon-button icon="editor:border-color" label="Configuration" interaction="{{item}}" on-tap="_toggleDialog">
                    <nuxeo-tooltip>Configuration</nuxeo-tooltip>
                  </paper-icon-button>
                </template>
              </nuxeo-data-table-column>
            </nuxeo-data-table>
            <paper-icon-button icon="icons:delete-forever" on-tap="_reset"
                               aria-label="Delete and Reset">
            </paper-icon-button>
          </div>
        </nuxeo-card>
      </div>

      <nuxeo-dialog id="dialog" opened="{{opened}}" on-iron-overlay-closed="_dialogClosed" with-backdrop>
        <div class="content">
          <div style="width: 30%; margin:auto;">
            <nuxeo-selectivity
                    class="selectivity-container"
                    multiple
                    min-chars="0"
                    data="{{documentTypes}}"
                    value="{{selectedInteraction.activeOnDocumentTypes}}"
                    placeholder="Select Document Types"
            ></nuxeo-selectivity>
          </div>
          <div style="width: 30%; margin:auto;">
            <p>Parameters</p>
            <template is="dom-repeat" items="[[selectedInteraction.parameters]]" as="item">
              <nuxeo-input role="widget" value="{{item.defaultValue}}" label="[[item.name]]" readonly="[[item.readOnly]]" type="[[item.type]]"></nuxeo-input>
            </template>
          </div>
        </div>
        <div class="buttons">
          <paper-button noink dialog-dismiss on-tap="_close">Close</paper-button>
          <paper-icon-button id="chat" icon="icons:save" on-tap="_saveInteractions"
                             aria-label="Save Configuration">
          </paper-icon-button>
        </div>
      </nuxeo-dialog>

    </nuxeo-page>
  </template>

  <script>
    Polymer({
      is: 'cp-settings',
      behaviors: [Nuxeo.LayoutBehavior, Nuxeo.ConfigurationBehaviour],
      properties: {
        interactions: {
          type: Array,
          value: [],
          observer: '_interactionsObserver',
          notify: true
        },

        selectedInteraction: {
          type: Object,
          observer: '_selectedInteractionObserver',
        },

        documentTypes: {
          type: Array,
          value: [],
          observer: '_documentTypesObserver'
        },
      },

      observers: ['_interactionsChangeObserver(interactions.*)'],

      ready: function () {
        this._getInteractions();
        this._getDocumentTypes();
      },

      _getInteractions: function () {
        const operation = this.$.getInteractionsOperation;
        operation.params = {};
        operation.execute().then((response) => {
          this.set('interactions', response.value);
        }).catch((error) => {
          console.error('Error triggering operation:', error);
        });
      },

      _getDocumentTypes: function () {
        const operation = this.$.docTypesOp;
        operation.params = {};
        operation.execute().then((response) => {
          this.set('documentTypes', response.value);
        }).catch((error) => {
          console.error('Error triggering operation:', error);
        });
      },

      _saveInteractions: function () {
        const operation = this.$.saveInteractionsOperation;
        operation.params = {'interactions': this.interactions};
        operation.execute().then((response) => {
          console.log(`_saveInteractions`, response.value);
          this._showNotification('Changes Saved!', 'success');
        }).catch((error) => {
          console.error('Error triggering operation:', error);
          this._showNotification('Changes NOT Saved!', 'error');
        });
      },

      _interactionsObserver: function (obs) {
        console.log(`_interactionsObserver:`, obs);
      },

      _selectedInteractionObserver: function (obs) {
        console.log(`_selectedInteractionObserver`, obs);
      },

      _interactionsChangeObserver: function (obs) {
        console.log(`_interactionsObserver:`, obs);
      },

      _documentTypesObserver: function (obs) {
        console.log(`_documentTypesObserver:`, obs);
      },

      _showNotification(message, type) {
        const toast = this.$.toast;
        toast.text = message;
        toast.classList.remove('toast-error', 'toast-success', 'toast-warning'); // Remove existing classes
        if (type) {
          toast.classList.add(`toast-${type}`);
        }
        toast.open();
      },

      _toggleDialog: function (e) {
        this.set('selectedInteraction', e.currentTarget.interaction);
        this.$.dialog.toggle();
      },

      _close: function () {
        this.$.dialog.toggle();
      },

      _dialogClosed: function () {
        this.$.dialog.toggle();
      },

      _reset: function () {
        const operation = this.$.getInteractionsOperation;
        operation.params = {"refresh": true};
        operation.execute().then((response) => {
          this.set('interactions', response.value);
        }).catch((error) => {
          console.error('Error triggering operation:', error);
        });
      },

    });
  </script>
</dom-module>
