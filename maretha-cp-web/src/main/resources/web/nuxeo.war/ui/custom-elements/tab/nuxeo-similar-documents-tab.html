
<link rel="import" href="../list/nuxeo-similar-documents.html">

<!--
`nuxeo-similar-documents-tab`
@group Nuxeo UI
@element nuxeo-similar-documents-tab
-->
<dom-module id="nuxeo-similar-documents-tab">
  <template>
    <style include="nuxeo-styles">
      :host {
        display: block;
      }
    </style>

    <template is="dom-if" if="[[visible]]">
      <nuxeo-similar-documents document="[[document]]" provider-name="searchByEmbeddings"></nuxeo-similar-documents>
    </template>
    
  </template>

  <script>
    Polymer({
      is: 'nuxeo-similar-documents-tab',
      properties: {
        document: {
          type: Object,
        },
        
        visible: {
          type: Boolean
        }

      },

      
    });
  </script>
</dom-module>
