<dom-module id="cp-settings-elasticsearch">
  <template>
    <nuxeo-operation id="saveInteractionsOperation" op="SaveInteractionsOperation"></nuxeo-operation>
    <nuxeo-operation id="getSettingsOperation" op="GetSettingsOperation"></nuxeo-operation>

    <style include="nuxeo-styles">
      .content {
        width: 100%;
      }

      nuxeo-card {
        width: 50%;
        height: 100%;
        text-align: left;
        box-shadow: 0 3px 20px rgb(0 0 0 / 10%);
      }
    </style>

    <div id="main slot">

      <nuxeo-card>
        <h3>Elasticsearch Query Settings</h3>
        <paper-toast id="toast"></paper-toast>

        <div class="content">

          <nuxeo-input role="widget" value="{{esSettings.BOOST}}"
                       label="BOOST" type="text"
                       placeholder="1.0" style="margin: auto;" on-change="_saveEsSettings"></nuxeo-input>
          <nuxeo-input role="widget" value="{{esSettings.TEXT_WEIGHT}}"
                       label="TEXT_WEIGHT" type="text"
                       placeholder="1.0" style="margin: auto;" on-change="_saveEsSettings"></nuxeo-input>
          <nuxeo-input role="widget" value="{{esSettings.IMAGE_WEIGHT}}"
                       label="IMAGE_WEIGHT" type="text"
                       placeholder="1.0" style="margin: auto;" on-change="_saveEsSettings"></nuxeo-input>
          <nuxeo-input role="widget" value="{{esSettings.SCORE_MODE}}"
                       label="SCORE_MODE" type="text"
                       placeholder="AVG" style="margin: auto;" on-change="_saveEsSettings"></nuxeo-input>
          <nuxeo-input role="widget" value="{{esSettings.BOOST_MODE}}"
                       label="BOOST_MODE" type="text"
                       placeholder="AVG" style="margin: auto;" on-change="_saveEsSettings"></nuxeo-input>

        </div>
      </nuxeo-card>
    </div>


  </template>

  <script>
    Polymer({
      is: 'cp-settings-elasticsearch',
      behaviors: [Nuxeo.LayoutBehavior, Nuxeo.ConfigurationBehaviour],
      properties: {
        esSettings: {
          type: Object,
          value: {}
        },
      },

      ready: function () {
        this._getEsSettings();
      },

      _getEsSettings: function () {
        const operation = this.$.getSettingsOperation;
        operation.params = {};
        operation.execute().then((response) => {
          if(response.value.esSettings)
            this.set('esSettings', response.value.esSettings);
        }).catch((error) => {
          console.error('Error triggering operation:', error);
        });
      },

      _saveEsSettings: function () {
        const operation = this.$.saveInteractionsOperation;
        operation.params = {
          'esSettings': this.esSettings
        };
        operation.execute().then((response) => {
          this._showNotification('Changes Saved!', 'success');
          this.set('esSettings', response.value.esSettings);
        }).catch((error) => {
          console.error('Error triggering operation:', error);
          this._showNotification('Changes NOT Saved!', 'error');
        });
      },

      _showNotification(message, type) {
        const toast = this.$.toast;
        toast.text = message;
        toast.classList.remove('toast-error', 'toast-success', 'toast-warning'); // Remove existing classes
        if (type) {
          toast.classList.add(`toast-${type}`);
        }
        toast.open();
      },

      _toggleDialog: function (e) {
        this.$.dialog.toggle();
      },

      _close: function () {
        this.$.dialog.toggle();
      },

      _dialogClosed: function () {
      }

    });
  </script>
</dom-module>
