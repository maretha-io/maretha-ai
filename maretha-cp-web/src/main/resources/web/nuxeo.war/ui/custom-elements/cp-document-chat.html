<dom-module id="cp-document-chat">
  <template>
    <nuxeo-operation id="getInteractionsOperation" op="GetInteractionsForDocumentOperation"
                     input="[[document]]"></nuxeo-operation>
    <nuxeo-operation id="runInteractionOperation" op="RunInteractionOperation"
                     input="[[document.uid]]"></nuxeo-operation>
    <style>
      .interaction-content {
        width: 95%;
        margin: auto;
        padding: 10px;
      }

      #dialog {
        height: 90%;
        width: 90%;
        margin: auto;
        overflow: auto;
      }

      .textarea {
        max-height: 400px;
        overflow-y: auto;
        overflow-x: auto;
      }

      .table {
        width: 100%;
        text-align: left;
      }

      .response-table-row {
        height: 50px;
        /* Set the desired height */
        overflow: scroll;
        /* Ensure content does not overflow */
      }

      #selectInteraction {
        max-width: 100%;
        margin: auto;
        text-align: left;
      }

      #auditButton {
        margin: auto;
        padding: 10px;
      }

      #parameters {
        max-width: 100%;
        margin: auto;
        text-align: left;
        border: 3px solid #ececec;
        border-radius: 15px;
        padding: 10px;
      }

      .flex-container {
        display: flex;
        flex-wrap: wrap;
        text-align: center;
      }

      .flex-item-left {
        padding: 10px;
        flex: 25%;
      }

      .flex-item-right {
        padding: 10px;
        flex: 70%;
      }

      .response {
        min-height: 400px;
        max-height: 600px;
        width: 100%;
        overflow-y: scroll;
        border: 3px solid #ececec;
        border-radius: 15px;
        text-align: left;
        padding: 15px;
      }
      .chat-response {
        min-height: 400px;
        max-height: 600px;
        width: 80%;
        margin: auto;
        margin-top: 5%;
        display: block;
        overflow-y: auto;
        border: 3px solid #ececec;
        border-radius: 15px;
        text-align: left;
        padding: 15px;
      }
    </style>

    <template is="dom-if" if="[[chatInteraction]]">
    <paper-icon-button icon="communication:chat" label="Chat with document" on-tap="_toggleDialog">
      <nuxeo-tooltip>Chat with document</nuxeo-tooltip>
    </paper-icon-button>
    </template>

    <nuxeo-dialog id="dialog" opened="{{dialogOpened}}" on-iron-overlay-closed="_dialogClosed" with-backdrop>
      <div style="margin:auto; text-align:center;">
        <h2>[[chatInteraction.name]]</h2>
        <p>[[chatInteraction.description]]</p>
      </div>

      <div id="chatResponse" class="chat-response">
        <cp-format-chat-json-response messages="[[chatContext]]" stream="[[interactionResponseStream]]"
                                      status="[[interactionStatus]]" loading="[[loading]]"></cp-format-chat-json-response>
      </div>

      <template is="dom-repeat" items="[[chatInteraction.parameters]]">
        <template is="dom-if" if="[[item.isContextMemoryParameter]]">
          <nuxeo-input role="widget" value="{{_computeChatValue(item, interactionResponse)}}"
                       label="[[item.name]]" hidden type="[[item.type]]"></nuxeo-input>
        </template>
        <nuxeo-input style="width: 40%;margin: auto;margin-top: 5%;" role="widget" value="{{item.value}}" label="[[item.name]]" hidden="[[item.readOnly]]"
                     readonly="[[item.readOnly]]" type="[[item.type]]" on-change="_interactWithDocument"></nuxeo-input>
      </template>

    </nuxeo-dialog>
  </template>

  <script>
    Polymer({
      is: 'cp-document-chat',
      behaviors: [Nuxeo.LayoutBehavior, Nuxeo.ConfigurationBehaviour],
      properties: {

        document: {
          type: Object,
          observer: '_docObserver'
        },

        chatContext: {
          type: Array,
          value: [],
          notify: true
        },
        
        chatInteraction: {
          type: Object
        },
        
        interactionResponse: {
          type: String,
        },

        interactionResponseStream: {
          type: String,
          value: ''
        },

        dialogOpened: {
          type: Boolean,
          observer: '_dialogOpenObserver'
        },

        loading: {
          type: Boolean,
          value: false
        },

      },

      _docObserver: function(doc) {
        if(doc){
          this._loadData();
        }
      },

      ready: function () {

      },

      _dialogOpenObserver: function (open) {
        if (open && !this.chatInteraction) {
          this._loadData();
        }
        if (!open) {
          this._resetData();
        }
      },

      _resetData() {
        this.set('chatInteraction', null);
        this.set('interactionResponse', null);
      },

      _documentObserver(doc) {
        this._debug('_documentObserver', doc);
        this._resetData();
        this._loadData();
      },

      _loadData() {
        this._getInteractions();
      },
            
      _getInteractions: function () {
        const operation = this.$.getInteractionsOperation;
        operation.params = {"isChat": true};
        operation.execute().then((response) => {
          this.set('chatInteraction', response.value[0]);
        }).catch((error) => {
          console.error('Error triggering operation:', error);
        });
      },

      _interactWithDocument: function () {
        if (!this.chatInteraction) return;
        this._addParametersToChatContext();
        this.set('loading', true);
        this.set('interactionStatus', 'Waiting for AI response...');
        this.set('interactionResponse', '');
        const operation = this.$.runInteractionOperation;
        operation.params = { "interactionId": this.chatInteraction.id, "data": this.chatInteraction.parameters };
        operation.execute().then((response) => {
          this._stream(response.value);
        }).catch((error) => {
          console.error('Error triggering operation:', error);
          this.set('interactionStatus', `<p>Error: ${error}</p>`);
        });
      },

      _addParametersToChatContext: function(){
        this.chatInteraction.parameters.forEach((param) => {
          if(param.isContextMemoryParameter) return;
          console.log(param);
          if(param.type === 'string'){
            this.push('chatContext',{ "role": "user", "param": param.name, "content": param.value, "date": new Date().toISOString() });
          }
        });
      },

      _stream: function (url) {
        this.set('interactionStatus', '');
        this.set('interactionResponseStream', '');
        this._eventSource = new EventSource(url);
        this._eventSource.onmessage = (event) => {
          //remove string quotes
          this.set('loading', false);
          this.interactionResponseStream = this.interactionResponseStream + event.data.slice(1, -1);
        };

        this._eventSource.onerror = (event) => {
          this.set('interactionResponseStream', "Failed to get response. Please try again...");
          this.set('loading', false);
        }

        this._eventSource.addEventListener("close", (event) => {
          const streamResponse = this.interactionResponseStream;
          this.set('interactionResponse', streamResponse);
          this.set('interactionResponseStream', '');
          const closeObject = JSON.parse(event.data);
          if (closeObject.error) {
            this.set('interactionResponseStream', closeObject.error.message);
          }
          this._eventSource.close();
          this.set('loading', false);
        });

      },
      
      _computeChatValue(contextParam, interactionResponse) {
        if (interactionResponse) {
          this.push('chatContext',{ "role": "assistant", "content": interactionResponse, "date": new Date().toISOString() });
        }
        contextParam.value = JSON.stringify(this.chatContext);
        return contextParam.value;
      },

      _toggleDialog: function () {
        this.$.dialog.toggle();
      },

    });
  </script>
</dom-module>
