<link rel="import" href="./cp-format-chat-json-response.html">

<dom-module id="cp-document-chat">
	<template>
		<style include="nuxeo-action-button-styles">
			::-webkit-scrollbar {
				height: 7px;
				width: 7px;
				background: #edeeef;
				box-shadow: none;
			}

			::-webkit-scrollbar-thumb {
				background: #cdcdcd;
				box-shadow: none;
			}

			:host {
				display: block;
				--paper-input-container-label_-_color: #999;
				--paper-input-container_-_padding: 0;
				--paper-button_-_padding: 0;
			}

			.chat {
				display: flex;
				flex-direction: column;
				border: 1px solid rgba(58, 85, 17, .3);
				box-shadow: 0 0 3.5rem -2rem inset rgb(58, 85, 17);
				padding: 1rem;
				gap: 2rem;
				overflow: hidden;
				max-height: 459px;
				border-radius: .325rem;
				margin: .5rem 0;
			}

			.question {
				display: flex;
				align-items: center;
				gap: 1rem;
				margin: 0 0 0 1rem;
			}

			@media screen and (min-width: 1400px) {
				.question {
					padding: 0 max(20%, 200px);
				}
			}

			.input {
				flex-grow: 1;
				display: flex;
				gap: 1rem;
				flex-wrap: wrap;
			}

			.input paper-input {
				flex: 1 0 calc(50% - 1rem);
			}

			.chat-response {
				flex-grow: 1;
				background-color: #f6f7f4;
				box-shadow: 0 1rem 1.5rem -2.25rem;
				overflow: auto;
			}

			paper-icon-button {
				width: 3.5rem;
				height: 3.5rem;
				padding: .25rem;
				color: var(--nuxeo-button-primary);
			}
		</style>

		<div class="chat">
			<div class="chat-response">
				<cp-format-chat-json-response messages="[[chatContext]]" stream="[[interactionResponseStream]]"
					document="[[document]]" chat-interaction="[[chatInteraction]]" status="[[interactionStatus]]"
					loading="[[loading]]">
				</cp-format-chat-json-response>
			</div>

			<div class="question">
				<div class="input">
					<template is="dom-repeat" items="[[chatInteraction.parameters]]" as="param">
						<paper-input role="widget" value="{{param.value}}" label="[[param.name]]"
							hidden="[[param.readOnly]]" readonly="[[param.readOnly]]" type="[[param.type]]"
							on-keydown="_keyPressed">
						</paper-input>

						<template is="dom-if" if="[[param.isContextMemoryParameter]]">
							<paper-input role="widget" value="{{_computeChatValue(param, interactionResponse)}}"
								label="[[param.name]]" hidden type="[[param.type]]">
							</paper-input>
						</template>
					</template>
				</div>

				<div>
					<paper-icon-button icon="custom-icons:ai-chat" on-tap="_interactWithDocument">
					</paper-icon-button>
					<nuxeo-tooltip>Ask question</nuxeo-tooltip>
				</div>
			</div>
		</div>

		<nuxeo-operation id="getSettingsOperation" op="GetInteractionsForDocumentOperation" input="[[document]]">
		</nuxeo-operation>

		<nuxeo-operation id="runInteractionOperation" op="RunInteractionOperation" input="[[document.uid]]">
		</nuxeo-operation>
	</template>

	<script>
		Polymer({
			is: 'cp-document-chat',
			behaviors: [Nuxeo.LayoutBehavior, Nuxeo.ConfigurationBehaviour],
			properties: {
				document: {
					type: Object
				},

				chatContext: {
					type: Array,
					value: [],
					notify: true
				},

				chatInteraction: {
					type: Object,
					value: null
				},

				interactionResponse: {
					type: String,
				},

				interactionResponseStream: {
					type: String,
					value: ''
				},

				loading: {
					type: Boolean,
					value: false
				},

				_showButton: {
					type: Boolean,
					value: false
				}
			},

			observers: [
				'_documentChanged(document.*)',
				'_chatInteractionChanged(chatInteraction.*)'
			],

			_documentChanged(doc)
			{
				this.set('_showButton', !!this.chatInteraction);
			},

			_chatInteractionChanged(chatInteraction)
			{
				this.set('_showButton', !!chatInteraction);
			},

			ready()
			{
				const operation = this.$.getSettingsOperation;
				operation.params = { "isChat": true };

				operation.execute()
					.then((response) =>
					{
						if (response.value && response.value.length > 0)
						{
							this.set('chatInteraction', response.value[0]);

							this.fire('interaction-ready', this.chatInteraction);
						}
					})
					.catch((error) =>
					{
						console.error('Error triggering operation:', error);
					});
			},

			_keyPressed(e)
			{
				if (e.key === 'Enter' && !e.shiftKey && !e.ctrlKey)
					this._interactWithDocument();
			},

			_interactWithDocument()
			{
				if (!this.chatInteraction)
					return;

				this._addParametersToChatContext();

				this.set('loading', true);
				this.set('interactionStatus', 'Waiting for AI response...');
				this.set('interactionResponse', '');

				const operation = this.$.runInteractionOperation;
				operation.params = { "interactionId": this.chatInteraction.id, "data": this.chatInteraction.parameters };
				operation.execute()
					.then((response) =>
					{
						this._stream(response.value);
					})
					.catch((error) =>
					{
						console.error('Error triggering operation:', error);
						this.set('interactionStatus', `<p>Error: ${error}</p>`);
					});
			},

			_addParametersToChatContext()
			{
				this.chatInteraction.parameters.forEach((param) =>
				{
					if (param.isContextMemoryParameter)
						return;

					if (param.type === 'string')
						this.push('chatContext', {
							role: 'user',
							param: param.name,
							content: param.value,
							date: new Date().toISOString()
						});
				});
			},

			_stream(url)
			{
				this.set('interactionStatus', '');
				this.set('interactionResponseStream', '');
				this._eventSource = new EventSource(url);
				this._eventSource.onmessage = (event) =>
				{
					//remove string quotes
					this.set('loading', false);
					this.interactionResponseStream = this.interactionResponseStream + event.data.slice(1, -1);
				};

				this._eventSource.onerror = (event) =>
				{
					this.set('interactionResponseStream', "Failed to get response. Please try again...");
					this.set('loading', false);
				}

				this._eventSource.addEventListener("close", (event) =>
				{
					const streamResponse = this.interactionResponseStream;
					this.set('interactionResponse', streamResponse);
					this.set('interactionResponseStream', '');
					const closeObject = JSON.parse(event.data);
					if (closeObject.error)
					{
						this.set('interactionResponseStream', closeObject.error.message);
					}
					this._eventSource.close();
					this.set('loading', false);
				});

			},

			_computeChatValue(contextParam, interactionResponse)
			{
				if (interactionResponse)
					this.push('chatContext', { "role": "assistant", "content": interactionResponse, "date": new Date().toISOString() });

				contextParam.value = JSON.stringify(this.chatContext);

				return contextParam.value;
			}
		});
	</script>
</dom-module>
