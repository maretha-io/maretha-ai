<dom-module id="cp-format-chat-json-response">
  <template>
    <style>
      body {
        font-family: Arial, sans-serif;
        margin: 0;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        background-color: #f5f5f5;
      }

      :host {
        display: block;
        width: 95%;
        margin: auto;
        background: white;
        padding: 10px;
        border-radius: 10px;
        box-shadow: 0px 4px 10px rgba(0, 0, 0, 0.1);
        overflow: hidden;
      }

      .chat-container {
        min-height: 10%;
        max-height: 50%;
        overflow-y: auto;
        display: flex;
        flex-direction: column;
        gap: 10px;
        scroll-behavior: smooth;
      }

      .message {
        padding: 10px;
        border-radius: 8px;
        max-width: 90%;
        word-wrap: break-word;
        font-size: 14px;
        line-height: 1.5;
      }

      .assistant {
        background: #e8f3ff;
        align-self: flex-end;
        text-align: left;
      }

      .user {
        background: #E5E5EA;
        align-self: flex-start;
        text-align: left;
      }

      .timestamp {
        font-size: 10px;
        color: gray;
        margin-top: 5px;
        display: block;
      }

      /* Loading text style */
      .loading-text {
        font-size: 1em;
        font-weight: bold;
        text-align: center;
        margin-top: 20px;
        color: #3498db;
      }


    </style>

    <div id="chatContainer" class="chat-container">
      <template is="dom-repeat" items="[[messages]]">
        <div class$="message [[_computeClass(item.role)]]">
          <div style="white-space: pre-wrap;" inner-h-t-m-l="[[_formatContent(item.content)]]"></div>
          <span class="timestamp">[[_formatDate(item.date)]]</span>
          <template is="dom-if" if="[[_isAssistantRole(item.role)]]">
            <cp-save-response document="[[document]]" interaction="[[chatInteraction]]" interaction-response="[[item.content]]"></cp-save-response>
          </template>
        </div>
      </template>

      <template is="dom-if" if="[[loading]]">
        <div class="loading-text">Processing...</div>
      </template>

      <template is="dom-if" if="[[status]]">
        <div class="loading-text">[[status]]</div>
      </template>

      <template is="dom-if" if="[[stream]]">
        <div class="message assistant">
          [[stream]]
        </div>
      </template>
    </div>
  </template>

  <script>
    Polymer({
      is: 'cp-format-chat-json-response',
      behaviors: [Nuxeo.LayoutBehavior, Nuxeo.ConfigurationBehaviour],
      properties: {

        document: {
          type: Object,
        },

        messages: {
          type: Array,
          observer: '_messagesObserver'
        },

        status: {
          type: String
        },

        chatInteraction: {
          type: Object
        },

        stream: {
          type: String,
          observer: '_streamObserver'
        },

        loading: {
          type: Boolean,
          value: false
        },

      },

      ready: function () {
      },

      _messagesObserver: function(messages){
      },

      _streamObserver: function(stream){
      // Auto-scroll to bottom after DOM update
        this.async(() => {
          const container = this.$.chatContainer;
          container.scrollTop = container.scrollHeight;
        }, 100);
      },

      _computeClass(role) {
        return role === "user" ? "user" : "assistant";
      },

      _isAssistantRole(role) {
        return role === "assistant";
      },

      _formatDate(dateString) {
        let date = new Date(dateString);
        return date.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
      },

      _formatContent(content) {
        if (!content) return '';
        let formatted = content.replace(/\\\\n|\\n/g, "")
            .trim();
        return formatted;
      }

    });
  </script>
</dom-module>
