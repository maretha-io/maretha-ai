<dom-module id="cp-format-chat-json-response">
	<template>
		<style>
			.chat-container {
				display: flex;
				flex-direction: column;
				gap: 2rem;
			}

			@media screen and (min-width: 1400px) {
				.chat-container {
					padding: 0 max(20%, 200px);
				}
			}

			.message {
				padding: 1rem;
				border-radius: .325rem;
				max-width: 75%;
				word-wrap: break-word;
				font-size: 1.125rem;
				line-height: 1.5;
				display: flex;
				gap: 1rem;
				align-items: start;
				justify-content: space-between;
				position: relative;
				margin: .25rem;
			}

			.message.assistant {
				background: rgb(130, 192, 39, .35);
				align-self: flex-end;
				text-align: left;
			}

			.message.user {
				background: rgb(130, 192, 39, .15);
				align-self: flex-start;
				text-align: left;
			}

			.timestamp {
				font-size: .85rem;
				opacity: .75;
				display: block;
				position: absolute;
				top: 0;
				margin: .25rem .5rem;
			}

			.message.user .timestamp {
				left: 100%;
			}

			.message.assistant .timestamp {
				right: 100%;
			}

			pre {
				margin: 0;
				white-space: pre-line;
			}

			pre::first-letter {
				text-transform: capitalize;
			}

			paper-menu-button {
				padding: 0;
			}

			paper-item {
				cursor: pointer;
			}
		</style>

		<div id="chatContainer" class="chat-container">
			<template is="dom-repeat" items="[[messages]]" as="message">
				<div class$="message [[_computeClass(message.role)]]">
					<span class="timestamp">[[_formatDate(message.date)]]</span>

					<pre inner-h-t-m-l="[[_formatContent(message.content)]]"></pre>

					<template is="dom-if" if="[[_isAssistantRole(message.role)]]">
						<paper-menu-button close-on-activate no-overlap no-animations horizontal-align="right"
							vertical-align="top">
							<paper-icon-button slot="dropdown-trigger" icon="icons:more-vert">
							</paper-icon-button>

							<paper-listbox slot="dropdown-content" attr-for-selected="data-id">
								<paper-item on-tap="_saveAsMetadata">
									Save interaction as metadata
								</paper-item>
								<paper-item on-tap="_saveAsRelatedDocument">
									Save interaction as new document
								</paper-item>
							</paper-listbox>
						</paper-menu-button>
					</template>
				</div>
			</template>

			<template is="dom-if" if="[[loading]]">
				<div id="loading" class="message assistant">
					<pre>
					[[ status ]]...
				</pre>
				</div>
			</template>

			<template is="dom-if" if="[[stream]]">
				<pre class="message assistant">
					[[stream]]
				</pre>
			</template>
		</div>

		<nuxeo-operation id="saveResponse" op="SaveInteractionResponseOperation" input="[[document]]"
			sync-indexing="true">
		</nuxeo-operation>
	</template>

	<script>
		Polymer({
			is: 'cp-format-chat-json-response',
			behaviors: [Nuxeo.LayoutBehavior, Nuxeo.ConfigurationBehaviour],
			properties: {

				document: Object,

				messages: Array,

				status: String,

				chatInteraction: Object,

				stream: {
					type: String,
					observer: '_streamObserver'
				},

				loading: {
					type: Boolean,
					value: false,
					observer: '_loadingObserver'
				},

			},

			_loadingObserver(loading)
			{
				if (loading)
					setTimeout(() => this.$$('#loading').scrollIntoView({ behavior: 'smooth', block: 'end', inline: 'nearest' }), 100);
			},

			_streamObserver(stream)
			{
				setTimeout(() => this.$.chatContainer.scrollIntoView({ behavior: 'smooth', block: 'end', inline: 'nearest' }), 100);
			},

			_computeClass(role)
			{
				return role === "user" ? "user" : "assistant";
			},

			_isAssistantRole(role)
			{
				return role === "assistant";
			},

			_formatDate(dateString)
			{
				return new Date(dateString).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
			},

			_formatContent(content)
			{
				return content ? content.replace(/\\\\n|\\n/g, "").trim() : '';
			},

			_saveAsMetadata(e)
			{
				this.$.saveResponse.params.saveOnMetadata = true;
				this._saveInteractionResponse(e);
			},

			_saveAsRelatedDocument(e)
			{
				this.$.saveResponse.params.saveOnMetadata = false;
				this._saveInteractionResponse(e);
			},

			_saveInteractionResponse(e)
			{
				const interactionResponse = e.model.__data.message;

				if (!interactionResponse)
				{
					this.fire('notify', { message: 'Cannot save without a response.' });
					return;
				}

				this.$.saveResponse.params.interactions = [{
					id: `${this.document.uid}-${this.chatInteraction.id}-${new Date().toISOString()}`,
					interactionId: this.chatInteraction.id,
					documentId: this.document.uid,
					response: interactionResponse.content,
					name: this.chatInteraction.name,
					status: this.chatInteraction.status,
					createdAt: new Date().toISOString(),
					createdBy: Nuxeo.UI.app.currentUser.id,
					parameters: this.chatInteraction.parameters
				}];

				this.$.saveResponse.execute()
					.then(response =>
					{
						this.fire('notify', { message: 'Response Saved!' });
						this.fire('document-updated');
					})
					.catch(() => this.fire('notify', { message: 'Error saving response' }));
			},
		});
	</script>
</dom-module>
