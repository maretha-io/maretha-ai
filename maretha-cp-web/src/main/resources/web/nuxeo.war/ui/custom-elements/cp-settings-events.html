<dom-module id="cp-settings-events">
    <template>
        <nuxeo-operation id="saveSettingsOp" op="SaveInteractionsOperation"></nuxeo-operation>
        <nuxeo-operation id="getSettingsOperation" op="GetSettingsOperation"></nuxeo-operation>

        <style include="nuxeo-styles">
            .content {
              width: 100%;
            }

            nuxeo-card {
              width: 100%;
              height: 100%;
              text-align: left;
              box-shadow: 0 3px 20px rgb(0 0 0 / 10%);
            }

            .results-table {
              min-height: 500px;
            }

            .event-entry,
            .add-entry-row {
              display: flex;
              flex-wrap: wrap;
              gap: 16px;
              padding: 16px;
              border-bottom: 1px solid #ddd;
              margin-bottom: 8px;
            }

            .event-entry nuxeo-selectivity,
            .add-entry-row nuxeo-selectivity {
              flex: 1 1 220px;
            }

            paper-toggle-button {
              align-self: center;
            }

            paper-button[raised] {
              align-self: center;
            }
        </style>

        <div id="main slot">
            <nuxeo-card>
                <h3>Events</h3>
                <paper-toast id="toast"></paper-toast>

                <template is="dom-repeat" items="{{eventsSettings}}" as="item" index-as="index">
                    <div class="event-entry">
                        <!-- DocType -->
                        <nuxeo-selectivity min-chars="0" data="{{documentTypes}}" value="{{item.docType}}"
                                           placeholder="Select Document Type">
                        </nuxeo-selectivity>

                        <!-- Events -->
                        <nuxeo-selectivity multiple min-chars="0" data="{{eventTypes}}" value="{{item.events}}"
                                           placeholder="Select Event Types">
                        </nuxeo-selectivity>

                        <!-- Interactions -->
                        <nuxeo-selectivity multiple min-chars="0" data="{{interactionsWithLabels}}" value="{{item.interactions}}"
                                           placeholder="Select Interactions">
                        </nuxeo-selectivity>

                        <!-- Active Toggle -->
                        <paper-toggle-button checked="{{item.active}}" on-change="_saveEventsSettings">
                            Active
                        </paper-toggle-button>

                        <!-- Delete Button -->
                        <paper-button on-tap="_deleteInteraction" doc-type="{{item.docType}}" data-index$="[[index]]" raised
                                      style="background:#f44336;color:white;">
                            Delete
                            <iron-icon icon="icons:delete-forever"></iron-icon>
                        </paper-button>
                    </div>
                </template>

                <!-- Add Entry Section -->
                <nuxeo-card heading="Add Entry">
                    <div class="add-entry-row">
                        <nuxeo-selectivity min-chars="0" data="{{documentTypes}}" value="{{newItem.docType}}"
                                           placeholder="Select Document Type">
                        </nuxeo-selectivity>

                        <nuxeo-selectivity multiple min-chars="0" data="{{eventTypes}}" value="{{newItem.events}}"
                                           placeholder="Select Event Types">
                        </nuxeo-selectivity>

                        <nuxeo-selectivity multiple min-chars="0" data="{{interactionsWithLabels}}" value="{{newItem.interactions}}"
                                           placeholder="Select Interactions">
                        </nuxeo-selectivity>

                        <paper-button raised class="primary" on-click="_addItem">Add</paper-button>
                    </div>
                </nuxeo-card>

                <paper-button id="save" on-tap="_saveEventsSettings" raised>
                    Save Settings
                    <iron-icon icon="icons:save"></iron-icon>
                </paper-button>
            </nuxeo-card>
        </div>
    </template>

    <script>
        Polymer({
          is: 'cp-settings-events',
          behaviors: [Nuxeo.LayoutBehavior, Nuxeo.ConfigurationBehaviour],
          properties: {
            eventsSettings: {
              type: Array,
              value: []
            },

            interactions: {
              type: Array,
              value: [],
            },

            documentTypes: {
              type: Array,
              value: [],
            },

            newItem: {
              type: Object,
              value: () => ({
                docType: '',
                events: [],
                interactions: []
              })
            },

            interactionsWithLabels: {
              type: Array,
              computed: '_computeInteractionsWithLabels(interactions)',
            },

            eventTypes: {
              type: Array,
              value: [
                      {id: 'documentCreated', displayLabel: 'Document Created'},
                      {id: 'pictureViewsGenerationDone', displayLabel: 'Rendition Created'},
                      {id: 'beforeDocumentModification', displayLabel: 'Document Modified'}
                     ]
            },
          },

          ready: function () {
            this._getEventsSettings();
          },

          _getEventsSettings: function () {
            const operation = this.$.getSettingsOperation;
            operation.params = {};
            operation.execute().then((response) => {
              if (response.value.eventsSettings)
                this.set('eventsSettings', response.value.eventsSettings);
            }).catch((error) => {
              console.error('Error triggering operation:', error);
            });
          },

          _saveEventsSettings: function () {
            const operation = this.$.saveSettingsOp;
            operation.params = {
              'eventsSettings': this.eventsSettings
            };
            operation.execute().then((response) => {
              this._showNotification('Changes Saved!', 'success');
              this.set('eventsSettings', response.value.eventsSettings);
            }).catch((error) => {
              console.error('Error triggering operation:', error);
              this._showNotification('Changes NOT Saved!', 'error');
            });
          },

          _showNotification(message, type) {
            const toast = this.$.toast;
            toast.text = message;
            toast.classList.remove('toast-error', 'toast-success', 'toast-warning'); // Remove existing classes
            if (type) {
              toast.classList.add(`toast-${type}`);
            }
            toast.open();
          },

          _toggleDialog: function (e) {
            this.$.dialog.toggle();
          },

          _close: function () {
            this.$.dialog.toggle();
          },

          _dialogClosed: function () {
          },

          _addItem() {
            const newItemCopy = Object.assign({}, this.newItem);
            if (!this.eventsSettings) {
              this.set('eventsSettings', []);
            }
            this.push('eventsSettings', newItemCopy);
            this._saveEventsSettings();

            // Reset form
            this.set('newItem', { docType: '', events: [], interactions: [] });
          },

          _computeInteractionsWithLabels() {
            return this.interactions.map(item => ({
              id: item.id,
              displayLabel: item.name,
            }));
          },

          _deleteInteraction: function (e) {
            const index = e.currentTarget.dataset.index;
            if (index !== undefined && index >= 0) {
              const item = this.eventsSettings[index];
              if (confirm(`Are you sure you want to delete the settings for: ${item.docType}?`)) {
                this.splice('eventsSettings', index, 1);
                this._saveEventsSettings();
              }
            }
          }

        });
    </script>
</dom-module>
