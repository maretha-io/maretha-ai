<dom-module id="cp-settings-events">
    <template>
        <nuxeo-operation id="saveSettingsOp" op="SaveInteractionsOperation"></nuxeo-operation>
        <nuxeo-operation id="getSettingsOperation" op="GetSettingsOperation"></nuxeo-operation>

        <style include="nuxeo-styles">
            .content {
              width: 100%;
            }

            nuxeo-card {
              width: 100%;
              height: 100%;
              text-align: left;
              box-shadow: 0 3px 20px rgb(0 0 0 / 10%);
            }

            .results-table {
                min-height: 500px;
            }

            .selectivity-wrapper{

            }

        </style>

        <div id="main slot">

            <nuxeo-card>
                <h3>Events Settings</h3>
                <paper-toast id="toast"></paper-toast>

                <div class="content">
                    <nuxeo-data-table items="{{eventsSettings}}" class="results-table">
                        <nuxeo-data-table-column name="DocType" flex="30">
                            <template>
                                <div class="selectivity-wrapper" style="display: inline-block;width: 100%;">
                                    <nuxeo-selectivity class="selectivity-container" style="margin: auto;text-align: left;" min-chars="0"
                                                       data="{{documentTypes}}" value="{{item.docType}}"
                                                       placeholder="Select Document Type"></nuxeo-selectivity>
                                </div>
                            </template>
                        </nuxeo-data-table-column>

                        <nuxeo-data-table-column name="Events" flex="50">
                            <template>
                                <div class="selectivity-wrapper" style="display: inline-block;width: 100%;">
                                    <nuxeo-selectivity class="selectivity-container" style="margin: auto;text-align: left;" multiple
                                                       min-chars="0" data="{{eventTypes}}" value="{{item.events}}"
                                                       placeholder="Select Event Types"></nuxeo-selectivity>
                                </div>
                            </template>
                        </nuxeo-data-table-column>

                        <nuxeo-data-table-column name="Interactions" flex="50">
                            <template>
                                <div class="selectivity-wrapper" style="display: inline-block;width: 100%;">
                                    <nuxeo-selectivity class="selectivity-container" style="margin: auto;text-align: left;" multiple
                                                       min-chars="0" data="{{interactionsWithLabels}}" value="{{item.interactions}}"
                                                       placeholder="Select Interactions"></nuxeo-selectivity>
                                </div>
                            </template>
                        </nuxeo-data-table-column>

                        <nuxeo-data-table-column name="Active" flex="10">
                            <template>
                                <paper-toggle-button checked="{{item.active}}" on-change="_saveEventsSettings">Active
                                </paper-toggle-button>
                            </template>
                        </nuxeo-data-table-column>

                        <nuxeo-data-table-column name="Delete" flex="10">
                            <template>
                                <div>
                                    <paper-button id="deleteInteraction" on-tap="_deleteInteraction" doc-type="{{item.docType}}"
                                                  aria-label="Delete" raised style="background-color: #f44336;color: white; ">
                                        Delete
                                        <iron-icon icon="icons:delete-forever"></iron-icon>
                                    </paper-button>
                                </div>
                            </template>
                        </nuxeo-data-table-column>
                    </nuxeo-data-table>

                    <nuxeo-card heading="Add Entry">
                        <div class="add-entry-row" style="display: flex; align-items: center; gap: 16px; flex-wrap: wrap;">

                            <!-- Document Type -->
                            <div style="flex: 1; min-width: 180px;">
                                <nuxeo-selectivity class="selectivity-container" style="margin: auto;text-align: left;" min-chars="0"
                                                   data="{{documentTypes}}" value="{{newItem.docType}}"
                                                   placeholder="Select Document Type"></nuxeo-selectivity>
                            </div>

                            <!-- Events -->
                            <div style="flex: 1; min-width: 180px;">
                                <nuxeo-selectivity class="selectivity-container" style="margin: auto;text-align: left;" multiple
                                                   min-chars="0" data="{{eventTypes}}" value="{{item.events}}"
                                                   placeholder="Select Event Types"></nuxeo-selectivity>
                            </div>

                            <!-- Interactions -->
                            <div style="flex: 2; min-width: 240px;">
                                <nuxeo-selectivity multiple min-chars="0" data="{{interactionsWithLabels}}"
                                                   value="{{newItem.interactions}}" placeholder="Select Interactions">
                                </nuxeo-selectivity>
                            </div>

                            <!-- Add Button -->
                            <div style="flex: 0 0 auto;">
                                <paper-button raised class="primary" on-click="_addItem">Add</paper-button>
                            </div>
                        </div>
                    </nuxeo-card>

                    <paper-button id="save" on-tap="_saveEventsSettings" aria-label="Save Settings" raised style="">
                        Save Settings
                        <iron-icon icon="icons:save"></iron-icon>
                    </paper-button>

                </div>
            </nuxeo-card>
        </div>


    </template>

    <script>
        Polymer({
          is: 'cp-settings-events',
          behaviors: [Nuxeo.LayoutBehavior, Nuxeo.ConfigurationBehaviour],
          properties: {
            eventsSettings: {
              type: Array,
              value: []
            },

            interactions: {
              type: Array,
              value: [],
            },

            documentTypes: {
              type: Array,
              value: [],
            },

            newItem: {
              type: Object,
              value: () => ({
                docType: '',
                events: '',
                interactions: []
              })
            },

            interactionsWithLabels: {
              type: Array,
              computed: '_computeInteractionsWithLabels(interactions)',
            },

            eventTypes: {
                type: Array,
                value: ['documentCreated', 'beforeDocumentModification']
            },
          },

          ready: function () {
            this._getEventsSettings();
          },

          _getEventsSettings: function () {
            const operation = this.$.getSettingsOperation;
            operation.params = {};
            operation.execute().then((response) => {
              if (response.value.eventsSettings)
                this.set('eventsSettings', response.value.eventsSettings);
            }).catch((error) => {
              console.error('Error triggering operation:', error);
            });
          },

          _saveEventsSettings: function () {
            const operation = this.$.saveSettingsOp;
            operation.params = {
              'eventsSettings': this.eventsSettings
            };
            operation.execute().then((response) => {
              this._showNotification('Changes Saved!', 'success');
              this.set('eventsSettings', response.value.eventsSettings);
            }).catch((error) => {
              console.error('Error triggering operation:', error);
              this._showNotification('Changes NOT Saved!', 'error');
            });
          },

          _showNotification(message, type) {
            const toast = this.$.toast;
            toast.text = message;
            toast.classList.remove('toast-error', 'toast-success', 'toast-warning'); // Remove existing classes
            if (type) {
              toast.classList.add(`toast-${type}`);
            }
            toast.open();
          },

          _toggleDialog: function (e) {
            this.$.dialog.toggle();
          },

          _close: function () {
            this.$.dialog.toggle();
          },

          _dialogClosed: function () {
          },

          _addItem() {
            const newItemCopy = Object.assign({}, this.newItem);
            if (!this.eventsSettings) {
              this.set('eventsSettings', []);
            }
            this.push('eventsSettings', newItemCopy);

            // Reset form
            this.set('newItem', { docType: '', events: [], interactions: [] });
          },

          _computeInteractionsWithLabels() {
            return this.interactions.map(item => ({
              id: item.id,
              displayLabel: item.name,
            }));
          },

          _deleteInteraction: function (e) {
            const docType = e.currentTarget.docType;
            if (confirm('Are you sure you want to remove this documentType event settings : ' + docType + ' ?')) {
              const newEventsSettings = this.eventsSettings.filter(obj => obj.docType !== docType);
              this.set('eventsSettings', newEventsSettings);
              this._saveEventsSettings();
            }
          },

        });
    </script>
</dom-module>
