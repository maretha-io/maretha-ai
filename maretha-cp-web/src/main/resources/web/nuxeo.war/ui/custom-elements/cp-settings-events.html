<dom-module id="cp-settings-events">
	<template>
		<style include="nuxeo-styles">
			:host {
				--nuxeo-tag_-_font-size: 0.85rem;
				--nuxeo-tag_-_line-height: 1.6;
			}

			.cards {
				display: flex;
				flex-wrap: wrap;
				gap: 1rem;
			}

			.cards nuxeo-card {
				width: calc(33.33% - 1rem);
				margin: 0;
			}

			.cards nuxeo-card .footer {
				border-top: 1px solid rgba(0, 0, 0, .25);
				margin-top: 2rem;
				padding-top: 1rem;
				display: flex;
				align-items: center;
				justify-content: end;
			}

			.cards nuxeo-card label {
				margin-top: 1.5rem;
			}

			.cards nuxeo-card .footer paper-icon-button {
				width: 2.75rem;
				height: 2.75rem;
			}

			.cards .new-event {
				width: calc(33.33% - 1rem);
				min-height: 20rem;
				;
				border: 2px dashed rgba(0, 0, 0, .5);
				cursor: pointer;
				display: flex;
				align-items: center;
				justify-content: center;
				gap: .5rem;
			}

			paper-item {
				cursor: pointer;
			}

			nuxeo-dialog {
				min-width: var(--nuxeo-document-form-popup-min-width, 300px);
				display: flex;
				flex-direction: column;
				justify-content: space-between;
				padding: 1rem 0;
			}

			nuxeo-dialog h3 {
				margin-top: 0;
			}

			nuxeo-dialog .buttons {
				padding: 2rem 2rem 1rem;
				justify-content: end;
			}

			nuxeo-dialog paper-button {
				text-transform: none;
			}

			nuxeo-dialog paper-button.primary {
				background-color: var(--nx-button-primary_-_background-color);
			}

			nuxeo-dialog paper-button.primary:hover,
			nuxeo-dialog paper-button.primary:focus {
				background-color: var(--nx-button-primary-hover_-_background-color);
			}

			nuxeo-dialog .dialog-options {
				display: flex;
				flex-direction: column;
				justify-content: space-between;
				gap: 2rem;
			}

			.flex-grow-1 {
				flex-grow: 1;
			}
		</style>

		<div class="cards">
			<template id="list" is="dom-repeat" items="[[ eventsSettings ]]" as="item" index-as="index">
				<nuxeo-card heading="[[ item.docType ]]">
					<label>Events</label>
					<template is="dom-repeat" items="[[ item.events ]]" as="eventType">
						<nuxeo-tag>[[ _eventName(eventType) ]]</nuxeo-tag>
					</template>

					<label>Interactions</label>
					<template is="dom-repeat" items="[[ item.interactions ]]" as="interactionId">
						<nuxeo-tag>[[ _interactionName(interactions, interactionId) ]]</nuxeo-tag>
					</template>

					<div class="footer">
						<paper-toggle-button checked="{{item.active}}" on-change="_markAsDirty">
							Active
						</paper-toggle-button>

						<span class="flex-grow-1"></span>

						<paper-icon-button icon="nuxeo:edit" on-tap="_toggleDialog" data-item-index$="[[ index ]]">
						</paper-icon-button>

						<paper-menu-button close-on-activate allow-outside-scroll>
							<paper-icon-button slot="dropdown-trigger" icon="icons:more-vert">
							</paper-icon-button>

							<paper-listbox slot="dropdown-content" attr-for-selected="data-id">
								<paper-item data-item-index$="[[ index ]]" on-tap="_deleteEvent">
									Delete this event
								</paper-item>
							</paper-listbox>
						</paper-menu-button>
					</div>
				</nuxeo-card>
			</template>

			<div class="new-event" on-tap="_toggleDialog">
				<iron-icon icon="icons:add"></iron-icon>
				Add a new event
			</div>
		</div>

		<nuxeo-dialog id="dialog" opened="{{opened}}" with-backdrop>
			<h3>Event settings</h3>

			<div class="dialog-options">
				<nuxeo-selectivity min-chars="0" data="{{documentTypes}}" value="{{_dialogData.docType}}"
					placeholder="Select a document type">
				</nuxeo-selectivity>

				<nuxeo-selectivity multiple min-chars="0" data="{{_eventTypes}}" value="{{_dialogData.events}}"
					placeholder="Choose one or more event types" stay-open-on-select>
				</nuxeo-selectivity>

				<nuxeo-selectivity multiple min-chars="0" data="{{_interactionsWithLabels}}" stay-open-on-select
					value="{{_dialogData.interactions}}" placeholder="Pick one or more interactions">
				</nuxeo-selectivity>
			</div>

			<div class="buttons">
				<paper-button noink dialog-dismiss class="secondary">
					Cancel
				</paper-button>

				<paper-button id="save" on-tap="_saveChanges" class="primary" raised disabled$="[[ !_dialogDirty ]]">
					Keep changes
				</paper-button>
			</div>
		</nuxeo-dialog>

	</template>

	<script>
		Polymer({
			is: 'cp-settings-events',
			behaviors: [Nuxeo.LayoutBehavior, Nuxeo.ConfigurationBehaviour],
			properties: {
				eventsSettings: {
					type: Array,
					value: []
				},

				interactions: {
					type: Array,
					value: [],
				},

				documentTypes: {
					type: Array,
					value: [],
				},

				_dialogData: {
					type: Object,
					value: {
						docType: '',
						events: [],
						interactions: []
					}
				},

				_selectedEventSettingIndex: Number,

				_interactionsWithLabels: {
					type: Array,
					computed: '_compute_interactionsWithLabels(interactions)',
				},

				_eventTypes: {
					type: Array,
					value: [
						{ id: 'documentCreated', displayLabel: 'Document Created' },
						{ id: 'pictureViewsGenerationDone', displayLabel: 'Rendition Created' },
						{ id: 'beforeDocumentModification', displayLabel: 'Document Modified' }
					]
				}
			},

			_toggleDialog(e)
			{
				this._selectedEventSettingIndex = e.target.dataset.itemIndex;

				if (this._selectedEventSettingIndex != undefined)
					this._dialogData = this.eventsSettings[this._selectedEventSettingIndex];
				else
					this._dialogData = {
						docType: '',
						events: [],
						interactions: []
					};

				this.$.dialog.toggle();
			},

			_saveChanges()
			{
				if (!this.eventsSettings)
					this.set('eventsSettings', []);

				if (this._selectedEventSettingIndex == undefined)
					this.eventsSettings.push(this._dialogData);
				else
					this.eventsSettings.splice(this._selectedEventSettingIndex, 1, this._dialogData);

				const eventsSettings = [...this.eventsSettings];
				this.set('eventsSettings', []);
				setTimeout(() =>
				{
					this.set('eventsSettings', eventsSettings);

					this._markAsDirty();
				});

				this.$.dialog.toggle();
			},

			_deleteEvent(e)
			{
				const index = e.currentTarget.dataset.itemIndex;

				if (index == undefined || index < 0)
					return;

				const item = this.eventsSettings[index];
				if (confirm(`Are you sure you want to delete the settings for: ${item.docType}?`))
				{
					this.eventsSettings.splice(index, 1);

					const eventsSettings = [...this.eventsSettings];
					this.set('eventsSettings', []);
					setTimeout(() =>
					{
						this.set('eventsSettings', eventsSettings);

						this._markAsDirty();
					});
				}
			},

			_markAsDirty()
			{
				this.fire('mark-as-dirty', { eventsSettings: this.eventsSettings });
			},

			_compute_interactionsWithLabels()
			{
				return this.interactions.map(item => ({
					id: item.id,
					displayLabel: item.name,
				}));
			},

			_eventName(eventType)
			{
				return this._eventTypes.find(x => x.id === eventType)?.displayLabel;
			},

			_interactionName(interactions, interactionId)
			{
				return interactions.find(x => x.id === interactionId)?.name;
			}
		});
	</script>
</dom-module>
