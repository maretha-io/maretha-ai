<dom-module id="cp-selectivity">
	<template>
		<nuxeo-selectivity value="{{ value }}" data="[[ data ]]" min-chars="0" tagging id-function="[[ idFunction ]]"
			result-formatter="[[ resultFormatter ]]" selection-formatter="[[ selectionFormatter ]]"
			selected-item="{{ _selectedInteraction }}" selected-items="{{ _selectedInteractions }}"
			multiple="[[ multiple ]]" stay-open-on-select="[[ multiple ]]" min-chars="0">
		</nuxeo-selectivity>
	</template>

	<script>
		Polymer({
			is: 'cp-selectivity',
			properties: {
				value: {
					notify: true
				},

				data: {
					type: Array,
					value: []
				},

				idFunction: {
					type: Function,
					value: function ()
					{
						return this._idFunction.bind(this);
					}
				},

				selectionFormatter: {
					type: Function,
					value: function ()
					{
						return this._selectionFormatter.bind(this);
					}
				},

				resultFormatter: {
					type: Function,
					value: function ()
					{
						return this._resultFormatter.bind(this);
					}
				},

				multiple: Boolean,

				_selectedInteraction: {
					type: Object,
					observer: '_selectionChanged'
				},

				_selectedInteractions: {
					type: Array,
					observer: '_selectionsChanged'
				}
			},

			_selectionChanged(e)
			{
				this.fire('selection-changed', e);
			},

			_selectionsChanged(e)
			{
				this.fire('selection-changed', e);
			},


			_idFunction(item)
			{
				return item.computedId || item.uid || item.id || item;
			},

			_selectionFormatter(item)
			{
				return this.escapeHTML(item.displayLabel || item.title || item);
			},

			_resultFormatter(item)
			{
				return this.escapeHTML(item.displayLabel || item.title || item);
			},

			escapeHTML: function (markup)
			{
				var replaceMap = {
					'\\': '&#92;',
					'&': '&amp;',
					'<': '&lt;',
					'>': '&gt;',
					'"': '&quot;',
					'\'': '&#39;',
					'/': '&#47;'
				};

				// Do not try to escape the markup if it's not a string
				if (typeof markup !== 'string')
				{
					return markup;
				}

				return String(markup).replace(/[&<>"'\/\\]/g, function (match)
				{
					return replaceMap[match];
				});
			}
		});
	</script>
</dom-module>
