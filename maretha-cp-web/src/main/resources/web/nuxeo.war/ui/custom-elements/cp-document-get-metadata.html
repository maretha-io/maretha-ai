<dom-module id="cp-document-get-metadata">
  <template>
    <nuxeo-operation id="getInteractionsOp" op="GetInteractionsForDocumentOperation"
                     input="[[document]]"></nuxeo-operation>
    <nuxeo-operation id="runInteractionOperation" op="RunInteractionOperation"
                     input="[[document.uid]]"></nuxeo-operation>

    <paper-menu-button id="dropdownButtonAi" close-on-activate no-overlap horizontal-align="right">
      <paper-icon-button
              id="aiButton"
              icon="icons:info-outline"
              slot="dropdown-trigger"
              aria-labelledby="iconButtonAITooltip"
              on-tap="_toggleOpened"
      ></paper-icon-button>
      <paper-listbox no-animations="" id="menu" selectable="item" slot="dropdown-content">
        <paper-icon-item name="update" on-click="_updateMetadata">
          <iron-icon icon="icons:info-outline" slot="item-icon">&gt;</iron-icon>
          <div>Update metadata</div>
        </paper-icon-item>
        <paper-icon-item name="add" on-click="_addMissingMetadata">
          <iron-icon icon="icons:info-outline" slot="item-icon">&gt;</iron-icon>
          <div>Add missing metadata</div>
        </paper-icon-item>
      </paper-listbox>
    </paper-menu-button>
    <nuxeo-tooltip for="aiButton" id="iconButtonAITooltip">AI Metadata</nuxeo-tooltip>

  </template>

  <script>
    Polymer({
      is: 'cp-document-get-metadata',
      behaviors: [Nuxeo.LayoutBehavior, Nuxeo.ConfigurationBehaviour],
      properties: {
        document: {
          type: Object,
        },

        interactions: {
          type: Array,
          value: [],
          notify: true
        },

        selectedInteraction: {
          type: Object
        },

        interactionResponse: {
          type: String,
        },

        dialogOpened: {
          type: Boolean,
        },

        saveMetadataModeOverride: {
          type: Boolean
        }

      },

      _resetData() {
        this.set('interactions', []);
        this.set('interactionResponse', null);
      },

      _toggleOpened() {
        this._resetData();
        this._loadData();
      },

      _loadData() {
        this._getInteractions();
      },

      _getInteractions: function () {
        const operation = this.$.getInteractionsOp;
        operation.params = {};
        operation.execute().then((response) => {
          this.set('interactions', response.value);
          const selectedInteraction = response.value.find(obj => obj.saveMetadata === true);
          this.set('selectedInteraction', selectedInteraction);
        }).catch((error) => {
          console.error('Error triggering operation:', error);
        });
      },

      _updateMetadata: function () {
        if (!this.selectedInteraction) return;
        this.set('interactionStatus', 'Waiting for AI response...');
        this.set('interactionResponse', '');
        const operation = this.$.runInteractionOperation;
        operation.params = {
          "interactionId": this.selectedInteraction.id,
          "data": this.selectedInteraction.parameters,
          "saveMetadata": this.selectedInteraction.saveMetadata,
          "saveMetadataModeOverride": true
        };
        this.fire('notify', { message: 'Metadata request in progress...' });
        operation.execute().then((response) => {
          this.set('interactionResponse', response.value);
          this.set('interactionStatus', '');
          this.fire('document-updated');
        }).catch((error) => {
          console.error('Error triggering operation:', error);
          this.fire('notify', { message: 'Cannot save metadata.' });
          this.set('interactionStatus', `<p>Error: ${error}</p>`);
        });
      },

      _addMissingMetadata: function () {
        if (!this.selectedInteraction) return;
        this.set('interactionStatus', 'Waiting for AI response...');
        this.set('interactionResponse', '');
        const operation = this.$.runInteractionOperation;
        operation.params = {
          "interactionId": this.selectedInteraction.id,
          "data": this.selectedInteraction.parameters,
          "saveMetadata": this.selectedInteraction.saveMetadata,
          "saveMetadataModeOverride": false
        };
        this.fire('notify', { message: 'Metadata request in progress...' });
        operation.execute().then((response) => {
          this.set('interactionResponse', response.value);
          this.set('interactionStatus', '');
          this.fire('document-updated');
        }).catch((error) => {
          console.error('Error triggering operation:', error);
          this.fire('notify', { message: 'Cannot save metadata.' });
          this.set('interactionStatus', `<p>Error: ${error}</p>`);
        });
      },

      _toggleDialog: function () {
        this.$.dialog.toggle();
      },

    });
  </script>
</dom-module>
