<dom-module id="cp-document-interaction">
  <template>
    <nuxeo-operation id="getInteractionsOperation" op="GetInteractionsForDocumentOperation" input="[[document]]"></nuxeo-operation>
    <nuxeo-operation id="runInteractionOperation" op="RunInteractionOperation"
      input="[[document.uid]]"></nuxeo-operation>
    <nuxeo-operation id="getRelationsOp" op="Relations.GetRelations" input="[[document]]"
      params='{"outgoing": "true", "predicate": "http://www.nuxeo.org/ecm/schemas/relation#isRelatedTo"}'>
    </nuxeo-operation>

    <style include="nuxeo-action-button-styles">
      .content {
        @apply --layout-vertical;
        min-height: 400px;
        max-height: 90%;
      }

      #dialog {
        width: 90%;
        margin: auto;
        overflow: scroll;
      }

      .textarea {
        max-height: 400px;
        overflow-y: auto;
        overflow-x: auto;
      }

      .table {
        width: 100%;
        text-align: left;
      }

      .response-table-row {
        height: 50px;
        /* Set the desired height */
        overflow: scroll;
        /* Ensure content does not overflow */
      }
    </style>

    <paper-icon-button icon="communication:chat" label="Interact with document" on-tap="_toggleDialog">
      <nuxeo-tooltip>AI Interact with document</nuxeo-tooltip>
    </paper-icon-button>

    <nuxeo-dialog id="dialog" opened="{{dialogOpened}}" on-iron-overlay-closed="_dialogClosed" with-backdrop>
      <div class="content">
        <div style="width: 90%; margin:auto; text-align: center;">
          <paper-dropdown-menu label="Select AI Interaction">
            <paper-listbox slot="dropdown-content" selected="{{selectedIndex}}">
              <template is="dom-repeat" items="[[interactions]]">
                <paper-item>[[item.name]]</paper-item>
              </template>
            </paper-listbox>
          </paper-dropdown-menu>

          <div style="width: 50%; margin:auto; text-align: center;">
            <template is="dom-repeat" items="[[selectedInteraction.parameters]]">
              <nuxeo-input role="widget" value="{{item.value}}" label="[[item.name]]" readonly="[[item.readOnly]]" type="[[item.type]]"></nuxeo-input>
            </template>
          </div>

          <div class="buttons" style="margin:10px;">
            <paper-button id="chat" on-tap="_interactWithDocument" aria-label="Interact with document" raised>
              Run Interaction
              <iron-icon icon="communication:chat"></iron-icon>
            </paper-button>
          </div>

          <div id="response"></div>

          <template is="dom-if" if="[[interactionResponse]]">
            <cp-save-response document="[[document]]" interaction="[[selectedInteraction]]"
              interaction-response="[[interactionResponse]]"></cp-save-response>
          </template>

          <div class="related-documents">
            <template is="dom-if" if="[[savedInteractions]]">
              <h3>Previous interactions</h3>
              <nuxeo-data-table class="table" items="[[savedInteractions]]">
                <nuxeo-data-table-column name="Name">
                  <template>
                    <a href="https://cloud.becomposable.com/studio/interactions/[[item.interactionId]]"
                      target="_blank">[[item.name]]</a>
                  </template>
                </nuxeo-data-table-column>
                <nuxeo-data-table-column name="Response" style="height: 50px; overflow: scroll;" flex="50">
                  <template>
                    [[item.response]]
                  </template>
                </nuxeo-data-table-column>
                <nuxeo-data-table-column name="Date">
                  <template>
                    [[item.createdAt]]
                  </template>
                </nuxeo-data-table-column>
              </nuxeo-data-table>
              <template is="dom-repeat" items="[[relatedDocuments]]">
                <div class="related-doc">
                  <a class="ellipsis" href$="[[urlFor(item)]]" on-click="_navigate" target="_blank">[[item.title]]</a>
                </div>
              </template>
            </template>
          </div>

        </div>
      </div>
    </nuxeo-dialog>

  </template>

  <script>
    Polymer({
      is: 'cp-document-interaction',
      behaviors: [Nuxeo.LayoutBehavior, Nuxeo.ConfigurationBehaviour],
      properties: {
        document: {
          type: Object,
          observer: '_documentObserver'
        },

        interactions: {
          type: Array,
          value: [],
          observer: '_interactionsObserver',
          notify: true
        },

        savedInteractions: {
          type: Array,
          value: [],
          observer: '_savedInteractionsObserver',
          notify: true
        },

        selectedInteraction: {
          type: Object,
          computed: '_computeSelectedValue(selectedIndex, interactions)',
          observer: '_selectedInteractionObserver',
        },

        interactionResponse: {
          type: Object,
          observer: '_interactionResponseObserver',
        },

        relatedDocuments: {
          type: Array,
          observer: '_relatedDocumentsObserver',
        },

        // Holds the selected index from the dropdown
        selectedIndex: {
          type: Number,
          value: -1,
        },

        dialogOpened: {
          type: Boolean,
          observer: '_dialogOpenObserver'
        },

        debugging: {
          type: Boolean,
          value: false
        },
      },

      _dialogOpenObserver: function (open) {
        if (open && this.interactions.length === 0) {
          this._loadData();
        }
        if (!open) {
          this._resetData();
        }
      },

      _resetData() {
        this.set('interactions', []);
        this.set('selectedIndex', null);
        this.set('selectedInteraction', null);
        this.set('interactionResponse', null);
        this.set('savedInteractions', []);
      },

      _documentObserver(doc) {
        this._debug('_documentObserver', doc);
        this._resetData();
        this._loadData();
      },

      _loadData() {
        this._getInteractions();
        if (this.hasFacet(this.document, 'InteractionResultsFacet')) {
          this._fetchRelatedDocuments();
          this._addMetadataInteractions();
        }
      },

      ready: function () {

      },

      _addMetadataInteractions() {
        const savedInteractions = this.savedInteractions || [];
        const interactions = this.document.properties['interactionresults:interactions'];
        if (interactions) {
          this.savedInteractions.push(...interactions);
        }
        this.set('savedInteractions', []);
        this.set('savedInteractions', savedInteractions);
      },

      _getInteractions: function () {
        const operation = this.$.getInteractionsOperation;
        operation.params = {};
        operation.execute().then((response) => {
          this.set('interactions', response.value);
        }).catch((error) => {
          console.error('Error triggering operation:', error);
        });
      },

      _interactWithDocument: function () {
        if (!this.selectedInteraction) return;
        this.$.response.innerHTML = '<p>Waiting for AI response...</p>';
        const operation = this.$.runInteractionOperation;
        operation.params = { "interactionId": this.selectedInteraction.id, "data": this.selectedInteraction.parameters };
        operation.execute().then((response) => {
          this.set('interactionResponse', response.value);
        }).catch((error) => {
          console.error('Error triggering operation:', error);
          this.$.response.innerHTML = `<p>Error: ${error}</p>`;
        });
      },

      _interactionsObserver(obs) {
        this._debug(`_interactionsObserver:`, obs);
      },

      _savedInteractionsObserver(obs) {
        this._debug(`_savedInteractionsObserver:`, obs);
      },

      _selectedInteractionObserver(obs) {
        this._debug('_selectedInteractionObserver', obs);
      },

      _interactionResponseObserver: function (obs) {
        const htmlFormatted = this._jsonToHtml(obs);
        this.$.response.innerHTML = htmlFormatted;
      },

      _relatedDocumentsObserver: function (obs) {
        if (!this.relatedDocuments) return;
        const savedInteractions = this.savedInteractions || [];
        this.relatedDocuments.forEach(doc => {
          const interactions = doc.properties['interactionresults:interactions'];
          savedInteractions.push(...interactions);
        });
        this.set('savedInteractions', []);
        this.set('savedInteractions', savedInteractions);
      },

      // Compute the selected value based on the selected index
      _computeSelectedValue: function (selectedIndex, jsonData) {
        if (selectedIndex >= 0 && jsonData && jsonData[selectedIndex]) {
          return jsonData[selectedIndex];
        }
        return '';
      },

      _toggleDialog: function () {
        this.$.dialog.toggle();
      },

      _close: function () {
      },

      _dialogClosed: function () {

      },

      _fetchRelatedDocuments() {
        if (this.document) {
          this.$.getRelationsOp.execute()
            .then((response) => {
              const documents = response.entries || [];
              this.relatedDocuments = documents.filter(doc => (doc.type === 'InteractionResults' && doc.isTrashed === false));
            })
            .catch((error) => {
              console.error('Error fetching related documents:', error);
            });
        }
      },

      _jsonToHtml: function (json) {
        let htmlOutput = '';
        for (let key in json) {
          if (json.hasOwnProperty(key)) {
            htmlOutput += `<p><b>${this._capitalizeFirstLetter(key)}:</b> ${json[key]}</p>`;
          }
        }
        return htmlOutput;
      },

      _capitalizeFirstLetter: function (string) {
        return string.charAt(0).toUpperCase() + string.slice(1);
      },

      _debug: function (name, info) {
        if (this.debug) {
          console.log(name, info);
        }
      },

    });
  </script>
</dom-module>
