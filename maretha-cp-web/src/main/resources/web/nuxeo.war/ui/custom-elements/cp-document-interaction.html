<dom-module id="cp-document-interaction">
  <template>
    <nuxeo-operation id="getInteractionsOperation" op="GetInteractionsForDocumentOperation"
                     input="[[document]]"></nuxeo-operation>
    <nuxeo-operation id="runInteractionOperation" op="RunInteractionOperation"
                     input="[[document.uid]]"></nuxeo-operation>

    <nuxeo-operation id="nxqlQueryOp" op="Document.Query" headers='{"Content-Type": "application/json"}'>
    </nuxeo-operation>
    <nuxeo-operation id="totalDocumentsQueryOp" op="Document.Query" headers='{"Content-Type": "application/json"}'>
    </nuxeo-operation>

    <style include="nuxeo-action-button-styles">
      .interaction-content {
        width: 95%;
        margin: auto;
        padding: 10px;
      }

      #dialog {
        height: 90%;
        width: 90%;
        margin: auto;
        overflow: auto;
      }

      .textarea {
        max-height: 400px;
        overflow-y: auto;
        overflow-x: auto;
      }

      .table {
        width: 100%;
        text-align: left;
      }

      .response-table-row {
        height: 50px;
        /* Set the desired height */
        overflow: scroll;
        /* Ensure content does not overflow */
      }

      #selectInteraction {
        max-width: 100%;
        margin: auto;
        text-align: left;
      }

      #auditButton {
        bottom: 50px;
        position: fixed;
        padding: 10px;
      }

      #parameters {
        max-width: 100%;
        margin: auto;
        text-align: left;
        border: 3px solid #ececec;
        border-radius: 15px;
        padding: 10px;
      }

      .flex-container {
        display: flex;
        flex-wrap: wrap;
        text-align: center;
      }

      .flex-item-left {
        padding: 10px;
        flex: 25%;
      }

      .flex-item-right {
        padding: 10px;
        flex: 70%;
      }

      #response {
        min-height: 400px;
        max-height: 600px;
        width: 100%;
        overflow-y: scroll;
        border: 3px solid #ececec;
        border-radius: 15px;
        text-align: left;
        padding: 15px;
      }
    </style>

    <paper-icon-button icon="communication:chat" label="Interact with document" on-tap="_toggleDialog">
      <nuxeo-tooltip>AI Interact with document</nuxeo-tooltip>
    </paper-icon-button>

    <nuxeo-dialog id="dialog" opened="{{dialogOpened}}" on-iron-overlay-closed="_dialogClosed" with-backdrop>
      <div class="interaction-content">
        <div class="flex-container">

          <div class="flex-item-left">
            <div id="selectInteraction">
              <paper-dropdown-menu label="Select AI Interaction" style="width: 100%;">
                <paper-listbox slot="dropdown-content" selected="{{selectedIndex}}">
                  <template is="dom-repeat" items="[[interactions]]">
                    <paper-item>[[item.name]]</paper-item>
                  </template>
                </paper-listbox>
              </paper-dropdown-menu>
            </div>

            <div id="parameters">
              <h3>Parameters</h3>
              <template is="dom-repeat" items="[[selectedInteraction.parameters]]">
                <nuxeo-input role="widget" value="{{item.value}}" label="[[item.name]]" hidden="[[item.readOnly]]"
                             readonly="[[item.readOnly]]" type="[[item.type]]"></nuxeo-input>
                <template is="dom-if" if="[[item.isMainDocument]]">
                  Main Document: [[document.properties.file:content.name]]
                </template>
                <template is="dom-if" if="[[item.isContextMemoryParameter]]">
                  <nuxeo-input role="widget" value="{{_computeValue(item, interactionResponse)}}" label="[[item.name]]"
                               hidden type="[[item.type]]"></nuxeo-input>
                </template>
                <template is="dom-if" if="[[item.enableDocSelection]]">
                  <div>
                    <nuxeo-document-suggestion value="{{item.selectedDocumentIds}}" label="Selected Documents"
                                               readonly="[[item.selectionReadOnly]]" multiple="true" min-chars="0" name="selectedDocs"
                                               role="widget"></nuxeo-document-suggestion>
                  </div>
                </template>
              </template>
            </div>
            Documents ready: [[documentsReady]] / [[totalDocuments]]

            <div class="buttons" style="margin:10px;">
              <paper-button id="chat" style="margin: 20px;" on-tap="_interactWithDocument"
                            aria-label="Interact with document" raised>
                Run Interaction
                <iron-icon icon="communication:chat"></iron-icon>
              </paper-button>
              <template is="dom-if" if="[[interactionResponse]]">
                <cp-save-response document="[[document]]" interaction="[[selectedInteraction]]"
                                  interaction-response="[[interactionResponse]]"></cp-save-response>
              </template>
            </div>
          </div>

          <div class="flex-item-right">
            <div id="response">
              [[interactionStatus]]
              <template is="dom-if" if="[[interactionResponseStream]]">
                [[interactionResponseStream]]
              </template>
              <template is="dom-if" if="[[interactionResponse]]">
                <cp-format-json-response json="[[interactionResponse]]"></cp-format-json-response>
              </template>

              <template is="dom-if" if="[[showPreviousInteractions]]">
                <cp-show-interaction-results document="{{document}}"></cp-show-interaction-results>
              </template>
            </div>
          </div>
        </div>

        <div id="auditButton">
          <paper-toggle-button checked="{{debugging}}" on-change="_showPreviousInteractions">Audit</paper-toggle-button>
        </div>

      </div>
    </nuxeo-dialog>

  </template>

  <script>
    Polymer({
      is: 'cp-document-interaction',
      behaviors: [Nuxeo.LayoutBehavior, Nuxeo.ConfigurationBehaviour],
      properties: {
        document: {
          type: Object,
          observer: '_documentObserver'
        },

        interactions: {
          type: Array,
          value: [],
          observer: '_interactionsObserver',
          notify: true
        },

        selectedInteraction: {
          type: Object,
          computed: '_computeSelectedValue(selectedIndex, interactions)',
          observer: '_selectedInteractionObserver',
        },

        interactionResponse: {
          type: Object,
          observer: '_interactionResponseObserver',
        },

        interactionResponseStream: {
          type: String,
          value: ''
        },

        relatedDocuments: {
          type: Array,
          observer: '_relatedDocumentsObserver',
        },

        // Holds the selected index from the dropdown
        selectedIndex: {
          type: Number,
          value: -1,
        },

        dialogOpened: {
          type: Boolean,
          observer: '_dialogOpenObserver'
        },

        debugging: {
          type: Boolean,
          value: false
        },

        showPreviousInteractions: {
          type: Boolean,
          value: false
        },

        documentsReady: {
          type: Number,
          value: 0
        },

        totalDocuments: {
          type: Number,
          value: 0
        },

        interactionStatus: {
          type: String,
        },

      },

      _dialogOpenObserver: function (open) {
        if (open && this.interactions.length === 0) {
          this._loadData();
        }
        if (!open) {
          this._resetData();
        }
      },

      _resetData() {
        this.set('interactions', []);
        this.set('selectedIndex', null);
        this.set('selectedInteraction', null);
        this.set('interactionResponse', null);
      },

      _documentObserver(doc) {
        this._debug('_documentObserver', doc);
        this._resetData();
        this._loadData();
      },

      _loadData() {
        this._getInteractions();
        this._executeDocumentsReadyQuery();
        this._executeTotalDocumentsQuery();
      },

      ready: function () {

      },

      _getInteractions: function () {
        const operation = this.$.getInteractionsOperation;
        operation.params = {};
        operation.execute().then((response) => {
          this.set('interactions', response.value);
        }).catch((error) => {
          console.error('Error triggering operation:', error);
        });
      },

      _interactWithDocument: function () {
        if (!this.selectedInteraction) return;
        this.set('interactionStatus', 'Waiting for AI response...');
        this.set('interactionResponse', '');
        const operation = this.$.runInteractionOperation;
        operation.params = { "interactionId": this.selectedInteraction.id, "data": this.selectedInteraction.parameters };
        operation.execute().then((response) => {
          this._stream(response.value);
        }).catch((error) => {
          console.error('Error triggering operation:', error);
          this.set('interactionStatus', `<p>Error: ${error}</p>`);
        });
      },

      _stream: function (url) {
        this.set('interactionStatus', '');
        this.set('interactionResponseStream', '');
        this._eventSource = new EventSource(url);
        this._eventSource.onmessage = (event) => {
          //remove string quotes
          this.interactionResponseStream = this.interactionResponseStream + event.data.slice(1, -1);
        };

        this._eventSource.onerror = (e) => {
          try {
            const streamResponse = this.interactionResponseStream;
            this.set('interactionResponse', streamResponse);
            this.set('interactionResponseStream', '');
          } catch (e) {
            console.error(e);
          }
          this._eventSource.close();
        };
      },

      _interactionsObserver(obs) {
        if (this.interactions) {
          this.set('selectedIndex', 0);
        }
        this._debug(`_interactionsObserver:`, obs);
      },

      _selectedInteractionObserver(obs) {
        this._debug('_selectedInteractionObserver', obs);
      },

      _interactionResponseObserver: function (obs) {
        this._debug('_interactionResponseObserver', obs);
        this._executeDocumentsReadyQuery();
      },

      // Compute the selected value based on the selected index
      _computeSelectedValue: function (selectedIndex, jsonData) {
        if (selectedIndex >= 0 && jsonData && jsonData[selectedIndex]) {
          return jsonData[selectedIndex];
        }
        return '';
      },

      _toggleDialog: function () {
        this.$.dialog.toggle();
      },

      _close: function () {
      },

      _dialogClosed: function () {

      },

      _showPreviousInteractions: function () {
        this.set('showPreviousInteractions', this.debugging);
      },

      _executeDocumentsReadyQuery: function () {
        if (!this.document) return;
        const op = this.$.nxqlQueryOp;
        op.params = {
          query: "SELECT * FROM Document WHERE (ecm:ancestorId = '" + this.document.uid + "' OR ecm:uuid = '" + this.document.uid + "') AND file:content IS NOT NULL AND ecm:mixinType = 'InteractionResultsFacet' AND ecm:isTrashed = 0 AND ecm:isProxy = 0"
        };
        op.execute().then((response) => {
          this.set('documentsReady', response.entries.length);
        }).catch((error) => {
        });
      },

      _executeTotalDocumentsQuery: function () {
        if (!this.document) return;
        const op = this.$.totalDocumentsQueryOp;
        op.params = {
          query: "SELECT * FROM Document WHERE (ecm:ancestorId = '" + this.document.uid + "' OR ecm:uuid = '" + this.document.uid + "') AND file:content IS NOT NULL AND ecm:isTrashed = 0 AND ecm:isProxy = 0"
        };
        op.execute().then((response) => {
          this.set('totalDocuments', response.entries.length);
        }).catch((error) => {
        });
      },

      _computeValue(item, interactionResponse) {
        if (!item.value) item.value = '';
        if (interactionResponse) {
          item.value += " Previous response: " + JSON.stringify(interactionResponse);
        }
        return item.value;
      },

      _debug: function (name, info) {
        if (this.debug) {
          console.log(name, info);
        }
      },

    });
  </script>
</dom-module>
