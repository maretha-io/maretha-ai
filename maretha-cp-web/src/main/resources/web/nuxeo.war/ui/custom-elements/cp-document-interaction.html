<dom-module id="cp-document-interaction">
	<template>
		<style include="nuxeo-action-button-styles">
			::-webkit-scrollbar {
				height: 7px;
				width: 7px;
				background: #edeeef;
				box-shadow: none;
			}

			::-webkit-scrollbar-thumb {
				background: #cdcdcd;
				box-shadow: none;
			}

			:host {
				display: block;
				--paper-input-container-label_-_color: #999;
				--paper-input-container_-_padding: 0;
				--paper-button_-_padding: 0;
			}

			.chat {
				display: flex;
				flex-direction: column;
				border: 1px solid rgba(58, 85, 17, .3);
				box-shadow: 0 0 3.5rem -2rem inset rgb(58, 85, 17);
				padding: 1rem;
				gap: 2rem;
				overflow: hidden;
				max-height: 459px;
				border-radius: .325rem;
				margin: .5rem 0;
			}

			.question {
				display: flex;
				align-items: center;
				gap: 1rem;
				margin: 0 0 0 1rem;
			}

			@media screen and (min-width: 1400px) {
				.question {
					padding: 0 max(20%, 200px);
				}
			}

			.input {
				flex-grow: 1;
				display: flex;
				gap: 1rem;
				flex-wrap: wrap;
			}

			.input paper-input,
			.input paper-dropdown-menu,
			.input p {
				flex: 1 0 calc(50% - 1rem);
			}

			.input p {
				color: #999;
				font-size: 1.125rem;
				border-bottom: 1px solid;
				margin: 1rem 0 0;
				padding-top: .5rem;
			}

			.chat-response {
				flex-grow: 1;
				background-color: #f6f7f4;
				box-shadow: 0 1rem 1.5rem -2.25rem;
				overflow: auto;
			}

			paper-icon-button {
				width: 3.5rem;
				height: 3.5rem;
				padding: .25rem;
				color: var(--nuxeo-button-primary);
			}
		</style>

		<div class="chat">
			<div class="chat-response">
				<cp-format-chat-json-response messages="[[interactionContext]]" stream="[[interactionResponseStream]]"
					document="[[document]]" chat-interaction="[[selectedInteraction]]" status="[[interactionStatus]]"
					loading="[[loading]]">
				</cp-format-chat-json-response>
			</div>

			<div class="question">
				<div class="input">
					<paper-dropdown-menu label="Select AI Interaction" style="width: 100%;">
						<paper-listbox slot="dropdown-content" selected="{{selectedIndex}}">
							<template is="dom-repeat" items="[[interactions]]">
								<paper-item>[[item.name]] - [[item.description]]</paper-item>
							</template>
						</paper-listbox>
					</paper-dropdown-menu>

					<template is="dom-repeat" items="[[selectedInteraction.parameters]]">
						<paper-input role="widget" value="{{item.value}}" label="[[item.name]]"
							hidden="[[item.readOnly]]" readonly="[[item.readOnly]]" type="[[item.type]]">
						</paper-input>

						<template is="dom-if" if="[[item.description]]">
							<p>Description: [[item.description]]</p>
						</template>

						<template is="dom-if" if="[[item.isMainDocument]]">
							<p>Main Document: [[document.properties.file:content.name]]</p>
						</template>

						<template is="dom-if" if="[[item.enableDocSelection]]">
							<div>
								<template is="dom-if" if="[[_isDocArrayType(item)]]">
									<nuxeo-document-suggestion value="{{item.selectedDocumentIds}}"
										label="Selected Documents" readonly="[[item.selectionReadOnly]]" multiple
										min-chars="0" name="selectedDocs" role="widget">
									</nuxeo-document-suggestion>
								</template>

								<template is="dom-if" if="[[!_isDocArrayType(item)]]">
									<nuxeo-document-suggestion value="{{item.selectedDocumentId}}"
										label="Selected Document" readonly="[[item.selectionReadOnly]]" min-chars="0"
										name="selectedDoc" role="widget">
									</nuxeo-document-suggestion>
								</template>
							</div>
						</template>
					</template>

				</div>

				<paper-icon-button icon="custom-icons:ai-interact" on-tap="_interactWithDocument">
				</paper-icon-button>
			</div>
		</div>

		<nuxeo-operation id="getSettingsOperation" op="GetInteractionsForDocumentOperation" input="[[document]]">
		</nuxeo-operation>

		<nuxeo-operation id="runInteractionOperation" op="RunInteractionOperation" input="[[document.uid]]">
		</nuxeo-operation>

		<nuxeo-operation id="nxqlQueryOp" op="Document.Query" headers='{"Content-Type": "application/json"}'>
		</nuxeo-operation>

		<nuxeo-operation id="totalDocumentsQueryOp" op="Document.Query" headers='{"Content-Type": "application/json"}'>
		</nuxeo-operation>
	</template>

	<script>
		Polymer({
			is: 'cp-document-interaction',
			behaviors: [Nuxeo.LayoutBehavior, Nuxeo.ConfigurationBehaviour],
			properties: {
				document: {
					type: Object,
					observer: '_documentObserver'
				},

				interactions: {
					type: Array,
					value: [],
					observer: '_interactionsObserver',
					notify: true
				},

				selectedInteraction: {
					type: Object,
					computed: '_computeSelectedValue(selectedIndex, interactions)'
				},

				interactionContext: {
					type: Array,
					value: []
				},

				interactionResponse: {
					type: String,
					observer: '_interactionResponseObserver',
				},

				interactionResponseStream: {
					type: String,
					value: ''
				},

				loading: {
					type: Boolean,
					value: false
				},

				relatedDocuments: {
					type: Array,
					observer: '_relatedDocumentsObserver',
				},

				// Holds the selected index from the dropdown
				selectedIndex: {
					type: Number,
					value: -1,
				},

				debugging: {
					type: Boolean,
					value: false
				},

				documentsReady: {
					type: Number,
					value: 0
				},

				totalDocuments: {
					type: Number,
					value: 0
				},

				interactionStatus: {
					type: String,
				},

			},

			_resetData()
			{
				this.set('interactions', []);
				this.set('selectedIndex', null);
				this.set('selectedInteraction', null);
				this.set('interactionResponse', null);
				this.set('interactionContext', []);
				this.set('interactionResponseStream', null);
			},

			_documentObserver(doc)
			{
				this._resetData();
				this._loadData();
			},

			_loadData()
			{
				this._getInteractions();
				this._executeDocumentsReadyQuery();
				this._executeTotalDocumentsQuery();
			},

			_getInteractions()
			{
				const operation = this.$.getSettingsOperation;

				operation.params = {};

				operation.execute()
					.then((response) =>
					{
						this.set('interactions', response.value);
					})
					.catch((error) =>
					{
						console.error('Error triggering operation:', error);
					});
			},

			_interactWithDocument()
			{
				if (!this.selectedInteraction)
					return;

				this.set('loading', true);

				this.set('interactionStatus', 'Waiting for AI response...');

				this.set('interactionResponse', '');

				this.set('interactionContext', [{
					role: 'user',
					date: new Date(),
					content: this.selectedInteraction.description
				}]);

				const operation = this.$.runInteractionOperation;

				operation.params = {
					interactionId: this.selectedInteraction.id,
					data: this.selectedInteraction.parameters,
					saveMetadata: this.selectedInteraction.saveMetadata
				};

				operation.execute()
					.then((response) =>
					{
						if (this.selectedInteraction.saveMetadata)
						{
							this.set('interactionResponse', response.value);

							this.push('interactionContext', {
								role: 'assistant',
								date: new Date(),
								content: response.value
							});

							this.set('interactionStatus', '');
						}
						else
							this._stream(response.value);
					})
					.catch((error) =>
					{
						console.error('Error triggering operation:', error);
						this.set('interactionStatus', `<p>Error: ${error}</p>`);
					});
			},

			_stream(url)
			{
				this.set('interactionStatus', '');
				this.set('interactionResponseStream', '');

				this._eventSource = new EventSource(url);

				this._eventSource.onmessage = (event) =>
				{
					//remove string quotes
					this.set('loading', false);
					this.interactionResponseStream = this.interactionResponseStream + event.data.slice(1, -1);
				};

				this._eventSource.onerror = (event) =>
				{
					this.set('loading', false);
					this.set('interactionResponseStream', "Failed to get response. Please try again...");
				}

				this._eventSource.addEventListener("close", (event) =>
				{
					const streamResponse = this.interactionResponseStream;

					this.set('interactionResponse', streamResponse);

					this.push('interactionContext', {
						role: 'assistant',
						date: new Date(),
						content: streamResponse
					});

					this.set('interactionResponseStream', '');

					const closeObject = JSON.parse(event.data);
					if (closeObject.error)
						this.set('interactionResponseStream', closeObject.error.message);

					this._eventSource.close();

					this.set('loading', false);
				});

			},

			_interactionsObserver(obs)
			{
				if (this.interactions)
					this.set('selectedIndex', 0);
			},

			_interactionResponseObserver(obs)
			{
				this._executeDocumentsReadyQuery();
			},

			// Compute the selected value based on the selected index
			_computeSelectedValue(selectedIndex, jsonData)
			{
				if (selectedIndex >= 0 && jsonData && jsonData[selectedIndex])
					return jsonData[selectedIndex];

				return '';
			},

			_executeDocumentsReadyQuery()
			{
				if (!this.document)
					return;

				const op = this.$.nxqlQueryOp;

				op.params = {
					query: "SELECT * FROM Document WHERE (ecm:ancestorId = '" + this.document.uid + "' OR ecm:uuid = '" + this.document.uid + "') AND file:content IS NOT NULL AND interactionresults:storeDigest IS NOT NULL AND ecm:mixinType = 'InteractionResultsFacet' AND ecm:isTrashed = 0 AND ecm:isProxy = 0"
				};

				op.execute()
					.then((response) =>
					{
						this.set('documentsReady', response.entries.length);
					});
			},

			_executeTotalDocumentsQuery()
			{
				if (!this.document)
					return;

				const op = this.$.totalDocumentsQueryOp;
				op.params = {
					query: "SELECT * FROM Document WHERE (ecm:ancestorId = '" + this.document.uid + "' OR ecm:uuid = '" + this.document.uid + "') AND file:content IS NOT NULL AND ecm:isTrashed = 0 AND ecm:isProxy = 0"
				};

				op.execute()
					.then((response) =>
					{
						this.set('totalDocuments', response.entries.length);
					});
			},

			_isDocArrayType(param)
			{
				return param.type === 'array' && param.format === 'document';
			}
		});
	</script>
</dom-module>
