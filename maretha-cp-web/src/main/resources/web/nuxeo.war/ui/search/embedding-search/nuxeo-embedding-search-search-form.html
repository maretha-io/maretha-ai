<!--
`nuxeo-embedding-search-search-form`
@group Nuxeo UI
@element nuxeo-embedding-search-search-form
-->
<dom-module id="nuxeo-embedding-search-search-form">
  <template>
    <style include="nuxeo-styles">
    </style>

    <!-- Full Text -->
    <nuxeo-input
            role="widget"
            id="searchInput"
            label="[[i18n('assetsSearch.fullText')]]"
            value="{{searchTerm}}"
            type="search"
            placeholder="[[i18n('assetsSearch.fullText.placeholder')]]"
            autofocus
            on-change="_search"
            aria-label$="[[i18n('defaultSearch.fullText')]]"
    >
    </nuxeo-input>

    <nuxeo-input
                 role="widget"
                 id="searchInput"
                 type="search"
                 label="What are you looking for?"
                 value="{{params.vectorQuery}}"
                 autofocus>
    </nuxeo-input>
    
  </template>

  <script>
    Polymer({
      is: 'nuxeo-embedding-search-search-form',
      behaviors: [Nuxeo.LayoutBehavior],
      properties: {

        params: {
          type: Object,
          notify: true,
        },
        
        searchTerm: {
          type: String,
          notify: true,
        },

        aggregations: {
          type: Object,
          value: {},
          notify: true,
        }

      },

      clear() {
        this.searchTerm = '';
        this._search();
      },

      _search() {
        if (this.searchTerm) {
          this.set('params.ecm_fulltext', this.formatFulltext(this.searchTerm));
        } else if (this.params && this.params.ecm_fulltext) {
          this.set('params.ecm_fulltext', '');
          // dirty but needed, the above line for
          // ecm_fulltext removal being observed
          delete this.params.ecm_fulltext;
        }
      },

      ready: function() {
        this.set('params.vectorField', "interactionresults:embeddingsText");
      },
      
      validate() {
        this.set('params.vectorField', "interactionresults:embeddingsText");
        this.set('params.k',"10");
        this.set('params.min_score',"0.4");
        return true
      }
      
    });
  </script>
</dom-module>
