<!--
`nuxeo-embedding-search-search-form`
@group Nuxeo UI
@element nuxeo-embedding-search-search-form
-->
<dom-module id="nuxeo-embedding-search-search-form">
  <template>
    <style include="nuxeo-styles">
    </style>

    <!-- Embeddings -->
    <nuxeo-input
            role="widget"
            id="searchInput"
            type="search"
            label="What are you looking for?"
            value="{{params.vectorQuery}}"
            autofocus>
    </nuxeo-input>

    <label>Min Score</label>
    <paper-slider
            role="widget"
            id="minScoreSlider"
            label="Minimum Score"
            type="number"
            min="0"
            max="1"
            step="0.1"
            snaps
            value="{{params.min_score}}"
            placeholder="0.8"
            pin>
    </paper-slider>

    <nuxeo-input
            role="widget"
            id="searchInput"
            type="search"
            label="[[i18n('defaultSearch.fullText')]]"
            value="{{searchTerm}}"
            placeholder="[[i18n('defaultSearch.fullText.placeholder')]]"
            autofocus
            on-keydown="_checkForEnter"
            aria-label$="[[i18n('defaultSearch.fullText')]]"
    >
    </nuxeo-input>

    <nuxeo-input role="widget" value="{{params.XCM_Insights_Title}}" label="Title" type="text" name="XCM_Insights_Title"></nuxeo-input>

    <nuxeo-input value="{{params.XCM_Insights_Creator_or_Author}}" label="Creator Or  Author" type="text" name="XCM_Insights_Creator_or_Author" role="widget"></nuxeo-input>

    <nuxeo-input value="{{params.XCM_Insights_Keywords}}" label="Keywords" type="text" name="XCM_Insights_Keywords" role="widget"></nuxeo-input>

    <div role="widget">
      <label id="XCM_Insights_Date_aggField">Date</label>
      <nuxeo-checkbox-aggregation value="{{params.XCM_Insights_Date_agg}}" data="[[aggregations.XCM_Insights_Date_agg]]" aria-labelledby="XCM_Insights_Date_aggField" name="XCM_Insights_Date_agg"></nuxeo-checkbox-aggregation>
    </div>

    <div role="widget">
      <label id="XCM_Insights_Language_aggField">Language</label>
      <nuxeo-checkbox-aggregation value="{{params.XCM_Insights_Language_agg}}" data="[[aggregations.XCM_Insights_Language_agg]]" aria-labelledby="XCM_Insights_Language_aggField" name="XCM_Insights_Language_agg"></nuxeo-checkbox-aggregation>
    </div>

    <div role="widget">
      <label id="XCM_Insights_Year_aggField">Year</label>
      <nuxeo-checkbox-aggregation value="{{params.XCM_Insights_Year_agg}}" data="[[aggregations.XCM_Insights_Year_agg]]" aria-labelledby="XCM_Insights_Year_aggField" name="XCM_Insights_Year_agg"></nuxeo-checkbox-aggregation>
    </div>

    <div role="widget">
      <label id="XCM_Insights_Quarter_aggField">Quarter</label>
      <nuxeo-checkbox-aggregation value="{{params.XCM_Insights_Quarter_agg}}" data="[[aggregations.XCM_Insights_Quarter_agg]]" aria-labelledby="XCM_Insights_Quarter_aggField" name="XCM_Insights_Quarter_agg"></nuxeo-checkbox-aggregation>
    </div>

    <div role="widget">
      <label id="XCM_Insights_Country_aggField">Country</label>
      <nuxeo-checkbox-aggregation value="{{params.XCM_Insights_Country_agg}}" data="[[aggregations.XCM_Insights_Country_agg]]" aria-labelledby="XCM_Insights_Country_aggField" name="XCM_Insights_Country_agg"></nuxeo-checkbox-aggregation>
    </div>

    <div role="widget">
      <label id="XCM_Insights_Big_Rock_aggField">Big  Rock</label>
      <nuxeo-checkbox-aggregation value="{{params.XCM_Insights_Big_Rock_agg}}" data="[[aggregations.XCM_Insights_Big_Rock_agg]]" aria-labelledby="XCM_Insights_Big_Rock_aggField" name="XCM_Insights_Big_Rock_agg"></nuxeo-checkbox-aggregation>
    </div>

  </template>

  <script>
    Polymer({
      is: 'nuxeo-embedding-search-search-form',
      behaviors: [Nuxeo.LayoutBehavior, Nuxeo.SearchParamsInterceptorBehavior],
      properties: {

        params: {
          type: Object,
          notify: true,
          observer: '_paramsObserver'
        },

        searchTerm: {
          type: String,
          notify: true,
        },

        aggregations: {
          type: Object,
          value: {},
          notify: true,
        },

        auto: {
          type: Boolean,
          value: true
        },

      },

      clear() {
        this.searchTerm = '';
        this._search();
      },

      _search() {
        if (this.searchTerm) {
          this.set('params.ecm_fulltext', this.formatFulltext(this.searchTerm));
        } else if (this.params && this.params.ecm_fulltext) {
          this.set('params.ecm_fulltext', '');
          // dirty but needed, the above line for
          // ecm_fulltext removal being observed
          delete this.params.ecm_fulltext;
        }
      },

     _checkForEnter(e) {
        if (e.keyCode === 13) {
          this._search();
        }
      },

      _paramsObserver(params) {
        if(!this.params.vectorField)
          this.set('params.vectorField', "interactionresults:embeddingsText");
        if(!this.params.min_score)
          this.set('params.min_score', 0.8);
      },
      
    });
  </script>
</dom-module>
