<link rel="import" href="configuration-behaviour.html">
<link rel="import" href="custom-elements/settings/cp-settings.html">
<link rel="import" href="cp-custom-icons.html">
<link rel="import" href="custom-elements/cp-selectivity.html">
<link rel="import" href="custom-elements/cp-collapsible-content.html">
<link rel="import" href="custom-elements/tab/cp-ai-tab.html">
<link rel="import" href="custom-elements/actions/cp-document-get-metadata.html">

<nuxeo-slot-content name="maretha-cp-interactions" slot="PAGES" order="100">
    <template>
        <nuxeo-filter user="[[user]]" expression="user && user.isAdministrator">
            <template>
                <cp-settings name="maretha-cp-interactions" user="[[user]]"></cp-settings>
            </template>
        </nuxeo-filter>
    </template>
</nuxeo-slot-content>

<nuxeo-slot-content name="maretha-cp" slot="ADMINISTRATION_MENU">
    <template>
        <nuxeo-filter user="[[user]]" expression="user && user.isAdministrator">
            <template>
                <nuxeo-menu-item name="maretha-cp" label="AI Settings"
                                 route="page:maretha-cp-interactions"></nuxeo-menu-item>
            </template>
        </nuxeo-filter>
    </template>
</nuxeo-slot-content>

<nuxeo-slot-content name="documentMetadata" slot="DOCUMENT_ACTIONS" order="0">
    <template>
        <nuxeo-filter document="[[document]]" expression="(this.isMember(user, &quot;administrators&quot;) || this.isMember(user, &quot;VERTESIA-METADATA&quot;))" user="[[user]]">
            <template>
                <cp-document-get-metadata document="[[document]]"></cp-document-get-metadata>
            </template>
        </nuxeo-filter>
    </template>
</nuxeo-slot-content>

<!-- Contribution of element 'nuxeo-menu-icon' for slot 'DRAWER_ITEMS' -->
<nuxeo-slot-content name="Find" slot="DRAWER_ITEMS" order="1">
    <template>
        <nuxeo-filter document="[[document]]" expression="(this.isMember(user, &quot;administrators&quot;) || this.isMember(user, &quot;VERTESIA-SEARCH&quot;))" user="[[user]]">
            <template>
                <nuxeo-menu-icon name="find" label="AI search" icon="custom-icons:ai-search"></nuxeo-menu-icon>
            </template>
        </nuxeo-filter>
    </template>
</nuxeo-slot-content>
<!-- Contribution of element 'nuxeo-search-form' for slot 'DRAWER_PAGES' -->
<nuxeo-slot-content name="Find" slot="DRAWER_PAGES">
    <template>
        <nuxeo-filter document="[[document]]" expression="(this.isMember(user, &quot;administrators&quot;) || this.isMember(user, &quot;VERTESIA-SEARCH&quot;))" user="[[user]]">
            <template>
                <nuxeo-search-form provider="searchByEmbeddings" auto="true" schemas="dublincore" search-name="embedding-search" name="find"></nuxeo-search-form>
            </template>
        </nuxeo-filter>
    </template>
</nuxeo-slot-content>


<nuxeo-slot-content name="AiTab" slot="DOCUMENT_VIEWS_ITEMS" order="10">
    <template>
        <nuxeo-filter document="[[document]]" facet="InteractionResultsFacet">
            <template>
                <nuxeo-page-item name="AiTab" label="AI"></nuxeo-page-item>
            </template>
        </nuxeo-filter>
    </template>
</nuxeo-slot-content>

<nuxeo-slot-content name="AiTab" slot="DOCUMENT_VIEWS_PAGES">
    <template>
        <nuxeo-filter document="[[document]]" facet="InteractionResultsFacet">
            <template>
                <cp-ai-tab document="[[document]]" user="[[user]]" name="AiTab"></cp-ai-tab>
            </template>
        </nuxeo-filter>
    </template>
</nuxeo-slot-content>

<script>
	(function () 
	{
		const styleSheet = new CSSStyleSheet();
		styleSheet.replaceSync(`nuxeo-document-create-button.maretha-cp-interactions { display: none !important }`);

		document.body.querySelector('nuxeo-app').shadowRoot.adoptedStyleSheets = [
			...document.body.querySelector('nuxeo-app').shadowRoot.adoptedStyleSheets,
			styleSheet
		];
	})();
</script>
