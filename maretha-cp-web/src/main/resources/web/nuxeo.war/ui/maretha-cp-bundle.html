<link rel="import" href="configuration-behaviour.html">
<link rel="import" href="custom-elements/cp-settings.html">
<link rel="import" href="custom-elements/cp-document-interaction.html">
<link rel="import" href="custom-elements/cp-save-response.html">
<link rel="import" href="custom-elements/cp-format-json-response.html">
<link rel="import" href="custom-elements/cp-show-interaction-results.html">

<nuxeo-slot-content name="maretha-cp-interactions" slot="PAGES" order="100">
    <template>
        <nuxeo-filter user="[[user]]" expression="user && user?.isAdministrator">
            <template>
                <cp-settings name="maretha-cp-interactions" user="[[user]]"></cp-settings>
            </template>
        </nuxeo-filter>
    </template>
</nuxeo-slot-content>

<nuxeo-slot-content name="maretha-cp" slot="ADMINISTRATION_MENU">
    <template>
        <nuxeo-filter user="[[user]]" expression="user && user?.isAdministrator">
            <template>
                <nuxeo-menu-item name="maretha-cp" label="AI Interactions Settings"
                                 route="page:maretha-cp-interactions"></nuxeo-menu-item>
            </template>
        </nuxeo-filter>
    </template>
</nuxeo-slot-content>

<nuxeo-slot-content name="documentInteractions" slot="DOCUMENT_ACTIONS" order="2">
    <template>
        <cp-document-interaction document="[[document]]"></cp-document-interaction>
    </template>
</nuxeo-slot-content>

<nuxeo-slot-content name="interactionResults" slot="DOCUMENT_VIEWS_PAGES" order="999">
    <template>
        <nuxeo-filter document="[[document]]" facet="InteractionResultsFacet">
            <template>
                <cp-show-interaction-results document="[[document]]"></cp-show-interaction-results>
            </template>
        </nuxeo-filter>
    </template>
</nuxeo-slot-content>
