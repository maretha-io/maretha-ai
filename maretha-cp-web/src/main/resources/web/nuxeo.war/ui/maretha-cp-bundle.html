<link rel="import" href="configuration-behaviour.html">
<link rel="import" href="custom-elements/cp-settings.html">
<link rel="import" href="custom-elements/cp-document-interaction.html">

<nuxeo-slot-content name="maretha-cp-interactions" slot="PAGES" order="100">
    <template>
        <cp-settings name="maretha-cp-interactions" user="user"></cp-settings>
    </template>
</nuxeo-slot-content>

<nuxeo-slot-content name="maretha-cp" slot="DRAWER_ITEMS" order="100">
    <template>
        <nuxeo-menu-icon name="maretha-cp" label="AI Composable Prompts"
                         icon="icons:extension"></nuxeo-menu-icon>
    </template>
</nuxeo-slot-content>

<nuxeo-slot-content name="maretha-cp" slot="DRAWER_PAGES">
    <template>
        <nuxeo-menu-item name="maretha-cp" label="Interactions Settings"
                         route="page:maretha-cp-interactions"></nuxeo-menu-item>
    </template>
</nuxeo-slot-content>

<nuxeo-slot-content name="documentInteractions" slot="DOCUMENT_ACTIONS" order="2">
    <template>
        <cp-document-interaction document="[[document]]"></cp-document-interaction>
    </template>
</nuxeo-slot-content>
