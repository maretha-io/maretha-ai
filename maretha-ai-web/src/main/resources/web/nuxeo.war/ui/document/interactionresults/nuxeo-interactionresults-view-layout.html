<dom-module id="nuxeo-interactionresults-view-layout">
    <template>
        <style include="nuxeo-styles">
            :host {
                @apply --paper-card;
            }
        </style>
        <template is="dom-repeat" items="[[document.properties.interactionresults:interactions]]">
            [[item.name]]

            <cp-format-json-response string-json="[[item.response]]"></cp-format-json-response>

            [[item.createdAt]]

        </template>

        <nuxeo-document-viewer role="widget" document="[[document]]"></nuxeo-document-viewer>
    </template>

    <script>
        Polymer({
            is: 'nuxeo-interactionresults-view-layout',
            behaviors: [Nuxeo.LayoutBehavior],
            properties: {
                document: {
                    type: Object,
                    observer: '_docObserver'
                },
            }

        });
    </script>
</dom-module>
