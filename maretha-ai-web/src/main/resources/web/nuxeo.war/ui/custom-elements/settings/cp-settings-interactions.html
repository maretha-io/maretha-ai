<dom-module id="cp-settings-interactions">
	<template>
		<style include="nuxeo-styles">
			:host {
				--paper-checkbox-checked-color: var(--nx-button-primary_-_background-color);
				--nuxeo-tag_-_font-size: 0.85rem;
				--nuxeo-tag_-_line-height: 1.6;
			}

			.config {
				display: flex;
				align-items: center;
				gap: 5rem;
				height: 100%;
			}

			.parameter-name {
				display: flex;
				flex-direction: column;
				line-height: 1.3;
			}

			.parameter-name div {
				text-transform: capitalize;
			}

			.parameter-name span {
				color: #888;
				display: inline-flex;
				gap: .25rem;
			}

			.delete-interaction {
				display: flex;
				justify-content: start;
				padding: 1.25rem 1rem 1.25rem;
			}

			.delete-interaction paper-button {
				background-color: #f44336;
				color: white;
				display: flex;
				align-items: center;
				gap: 0.5rem;
			}

			nuxeo-card {
				box-shadow: 0 0 3px -1px rgba(0, 0, 0, .5);
				margin: 1rem 1rem 0;
				padding: 1rem;
			}

			paper-toggle-button {
				cursor: pointer;
			}

			table {
				border-collapse: collapse;
				border-spacing: 0;
				width: 100%;
			}

			table thead tr,
			table tbody tr {
				border-bottom: var(--iron-data-table-row_-_border-bottom, 1px solid var(--nuxeo-border, #e3e3e3));
			}

			table thead tr th {
				background-color: var(--iron-data-table-header_-_background-color);
				color: var(--iron-data-table-header_-_color);
				padding: 8px 24px;
				text-align: left;
			}

			table tbody tr td {
				padding: 8px 24px;
				text-align: left;
			}

			table thead tr th:nth-of-type(1),
			table tboddy tr td:nth-of-type(1) {
				width: 7%;
			}

			table thead tr th:nth-of-type(3),
			table thead tr th:nth-of-type(4),
			table thead tr th:nth-of-type(5),
			table thead tr th:nth-of-type(6),
			table thead tr th:nth-of-type(7),
			table tbody tr td:nth-of-type(3),
			table tbody tr td:nth-of-type(4),
			table tbody tr td:nth-of-type(5),
			table tbody tr td:nth-of-type(6),
			table tbody tr td:nth-of-type(7) {
				text-align: center;
				width: 7%;
			}

			table tbody tr td nuxeo-document-suggestion {
				margin-bottom: -1rem;
			}

			table tbody tr td paper-input {
				margin-bottom: 1rem;
			}

			.na {
				text-align: center;
				color: #AAA;
				display: inline-block;
			}
		</style>

		<template id="list" is="dom-repeat" items="[[ interactions ]]" as="interaction" index-as="ix">
			<cp-collapsible-content label="[[ interaction.name ]]" description="[[ interaction.description ]]"
									active="[[ interaction.active ]]" status="[[ interaction.status ]]" version="[[ interaction.version ]]"
									is-dirty="[[ _isDirty(interaction._dirty, changesSaved) ]]" show-stats>

				<nuxeo-card role="widget" class="nuxeo-card" heading="Prompt">
					<paper-textarea type="text" value="{{interaction.prompt}}"
									on-input="_markAsDirty">
					</paper-textarea>
				</nuxeo-card>

				<nuxeo-card role="widget" class="nuxeo-card" heading="Activation">
					<nuxeo-selectivity class="selectivity-container" multiple min-chars="0" data="{{documentTypes}}"
									   value="{{interaction.activeOnDocumentTypes}}" required data-ix$="[[ ix ]]"
									   on-value-changed="_activeDocumentsChanged" stay-open-on-select
									   label="List of document types this interaction is active for"
									   placeholder="Select one or more document type this interaction should be active for"></nuxeo-selectivity>
				</nuxeo-card>

				<nuxeo-card role="widget" class="nuxeo-card" heading="AI Model">
					<nuxeo-selectivity class="selectivity-container" min-chars="0" data="[[modelChoices]]"
									   value="{{interaction.model}}" required data-ix$="[[ ix ]]"
									   on-value-changed="_activeDocumentsChanged" stay-open-on-select
									   label="AI model"
									   placeholder="Select the AI model"></nuxeo-selectivity>
				</nuxeo-card>

				<nuxeo-card role="widget" class="nuxeo-card" heading="Settings">
					<div class="config">
						<paper-toggle-button checked="{{interaction.active}}" on-change="_markAsDirty">
							Enabled
						</paper-toggle-button>

						<paper-toggle-button checked="{{interaction.activeOnActionMenu}}" on-change="_markAsDirty">
							Available in Action Menu
						</paper-toggle-button>

						<paper-toggle-button checked="{{interaction.activeOnFolder}}" on-change="_markAsDirty">
							Executable on Folders
						</paper-toggle-button>

						<paper-toggle-button checked="{{interaction.chat}}" on-change="_markAsDirty">
							Is Chat
						</paper-toggle-button>

						<paper-toggle-button checked="{{interaction.saveMetadata}}" on-change="_markAsDirty">
							Save Metadata
						</paper-toggle-button>

						<paper-toggle-button disabled$="[[ !interaction.saveMetadata ]]"
											 checked="{{interaction.mainMetadata}}" on-change="_markAsDirty">
							Main Metadata
						</paper-toggle-button>
					</div>
					</div>

				</nuxeo-card>

				<div class="delete-interaction">
					<paper-button id="deleteInteraction" on-tap="_deleteInteraction" aria-label="Delete">
						<iron-icon icon="icons:delete-forever"></iron-icon>
						<span>Permanently delete this interaction</span>
					</paper-button>
				</div>

			</cp-collapsible-content>
		</template>

		<nuxeo-card role="widget" class="nuxeo-card" heading="Add New Interaction">
			<div style="display:flex; gap:1rem; align-items:center;">
				<paper-input label="Interaction Name" value="{{newInteractionName}}"></paper-input>
				<paper-button raised on-tap="_addInteraction" class="primary">
					<iron-icon icon="icons:add"></iron-icon>
					Add
				</paper-button>
			</div>
		</nuxeo-card>
	</template>
	<script>
		Polymer({
			is: 'cp-settings-interactions',
			behaviors: [Nuxeo.LayoutBehavior, Nuxeo.NotifyBehavior],
			properties: {
				interactions: {
					type: Array,
					value: [],
					notify: true
				},
				documentTypes: {
					type: Array,
					value: [],
					notify: true
				},
				aiSettings: {
					type: Array,
					value: [],
					notify: true
				},
				modelChoices: {
				  type: Array,
				  value: [
				  		{'id': 'cohere.command-r-v1:0', 'text': 'cohere.command-r-v1:0'},
				  		{'id': 'anthropic.claude-3-sonnet-20240229-v1:0', 'text': 'anthropic.claude-3-sonnet-20240229-v1:0'},
				  		{'id': 'anthropic.claude-3-5-sonnet-20241022-v2:0', 'text': 'anthropic.claude-3-5-sonnet-20241022-v2:0'},
				  		{'id': 'anthropic.claude-3-7-sonnet-20250219-v1:0', 'text': 'anthropic.claude-3-7-sonnet-20250219-v1:0'}
				  		]
				},
				changesSaved: {
					type: Boolean,
					value: true
				},
				_selectedParameterIndex: Number,
				_selectedInteractionIndex: Number,
				_selectedItems: Array,
				_selectedItem: String,
				newInteractionName: {
					type: String,
					value: ''
			  	},
			},

			observers: [
				'_markAsDirty(_selectedItem, _selectedItems.splices)'
			],

			_hasDefaultValue(format)
			{
				return format !== 'media' && format !== 'document';
			},

			_selectedItemsChanged(e)
			{
				console.log('_selectedItemsChanged', e);
			},

			_setSelectedParameterIndex(e)
			{
				this.set('_selectedInteractionIndex', e.target.dataset.ix);
				this.set('_selectedParameterIndex', e.target.dataset.px);
			},

			_deleteInteraction(e)
			{
				const interaction = e.model.__data.interaction;

				if (!confirm(`Are you sure you want to remove this interaction: ${interaction.name}?`))
					return;

				this.set('interactions', this.interactions.filter(x => x.id !== interaction.id));

				this.fire('mark-as-dirty', { interactions: this.interactions });
			},

			_isDocArrayType(param)
			{
				return param.type === 'array' && param.format === 'document';
			},

			_isDocType(param)
			{
				return param.format === 'document';
			},

			_activeDocumentsChanged(e)
			{
				this.set(`interactions.${(e.target.dataset.ix | 0)}._dirty`, true);

				this.fire('mark-as-dirty', { interactions: this.interactions });
			},

			_markAsDirty(e)
			{
				this.set(`interactions.${e && e.model ? e.model.__data.ix : this._selectedInteractionIndex}._dirty`, true);

				this.fire('mark-as-dirty', { interactions: this.interactions });
			},

			_isDirty(interactionDirty)
			{
				return interactionDirty && !this.changesSaved;
			},

			_enableDocSelectionChanged(e)
			{
				this._markAsDirty(e);

				// Force Polymer to re-evaluate the second column's dom-if
				this.notifyPath(`interactions.${e.model.__data.ix}.parameters.${e.target.dataset.index}.enableDocSelection`);
			},

			_addInteraction() {
			  if (!this.newInteractionName) {
				this.notify({ message: 'Please enter a name for the interaction' });
				return;
			  }

			  const newInteraction = {
				id: Date.now(), // simple unique id
				name: this.newInteractionName,
				description: '',
				prompt: '',
				active: false,
				activeOnDocumentTypes: [],
				model: '',
				version: 1,
				_dirty: true
			  };

			  this.push('interactions', newInteraction);
			  this.set('newInteractionName', ''); // reset input
			  this.fire('mark-as-dirty', { interactions: this.interactions });
			}

		})
	</script>
</dom-module>
