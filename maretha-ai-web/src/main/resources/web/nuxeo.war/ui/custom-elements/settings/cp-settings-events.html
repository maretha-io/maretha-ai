<dom-module id="cp-settings-events">
	<template>
		<style include="nuxeo-styles">
			:host {
				--nuxeo-tag_-_font-size: 0.85rem;
				--nuxeo-tag_-_line-height: 1.6;
			}

			.cards {
				display: flex;
				flex-wrap: wrap;
				gap: 1rem;
			}

			.cards nuxeo-card {
				width: calc(33.33% - 1rem);
				margin: 0;
			}

			.cards nuxeo-card .footer {
				border-top: 1px solid rgba(0, 0, 0, .25);
				margin-top: 2rem;
				padding-top: 1rem;
				display: flex;
				align-items: center;
				justify-content: end;
			}

			.cards nuxeo-card label {
				margin-top: 1.5rem;
			}

			.cards nuxeo-card .footer paper-icon-button {
				width: 2.75rem;
				height: 2.75rem;
			}

			.cards .new-event {
				width: calc(33.33% - 1rem);
				min-height: 20rem;
				;
				border: 2px dashed rgba(0, 0, 0, .5);
				cursor: pointer;
				display: flex;
				align-items: center;
				justify-content: center;
				gap: .5rem;
			}

			paper-item {
				cursor: pointer;
			}

			nuxeo-dialog {
				min-width: var(--nuxeo-document-form-popup-min-width, 300px);
				display: flex;
				flex-direction: column;
				justify-content: space-between;
				padding: 1rem 0;
			}

			nuxeo-dialog h3 {
				margin-top: 0;
			}

			nuxeo-dialog .buttons {
				padding: 2rem 2rem 1rem;
				justify-content: end;
			}

			nuxeo-dialog paper-button {
				text-transform: none;
			}

			nuxeo-dialog paper-button.primary {
				background-color: var(--nx-button-primary_-_background-color);
			}

			nuxeo-dialog paper-button.primary:hover,
			nuxeo-dialog paper-button.primary:focus {
				background-color: var(--nx-button-primary-hover_-_background-color);
			}

			nuxeo-dialog .dialog-options {
				display: flex;
				flex-direction: column;
				justify-content: space-between;
				gap: 2rem;
			}

			.flex-grow-1 {
				flex-grow: 1;
			}

			paper-toggle-button {
				cursor: pointer;
			}

			table {
				border-collapse: collapse;
				border-spacing: 0;
				width: 100%;
			}

			table thead tr,
			table tbody tr {
				border-bottom: var(--iron-data-table-row_-_border-bottom, 1px solid var(--nuxeo-border, #e3e3e3));
			}

			table thead tr th {
				background-color: var(--iron-data-table-header_-_background-color);
				color: var(--iron-data-table-header_-_color);
				padding: 8px 24px;
				text-align: left;
			}

			table tbody tr td {
				padding: 8px 24px;
				text-align: left;
			}

			table tbody tr.invalid {
				background-color: rgba(255, 99, 71, .25);
			}

			table thead tr th:nth-of-type(1) {
				width: 15%;
			}

			table thead tr th:nth-of-type(2) {
				width: 25%;
			}

			table thead tr th:nth-of-type(5) {
				width: 1rem;
			}

			table thead tr th:nth-of-type(4),
			table tbody tr td:nth-of-type(4) {
				text-align: center;
				width: 3rem;
			}

			table tbody tr td nuxeo-document-suggestion {
				margin-bottom: -1rem;
			}

			table tbody tr td paper-input {
				margin-bottom: 1rem;
			}

			table tfoot tr th {
				padding: 8px 24px;
				text-align: left;
			}

			nuxeo-tag {
				white-space: nowrap;
			}

			.new {
				text-align: center;
				color: var(--nuxeo-button-primary);
			}

			.new paper-icon-button {
				padding: .25rem;
			}
		</style>

		<table>
			<thead>
				<tr>
					<th>Document type</th>
					<th>Events</th>
					<th>Interactions</th>
					<th>Active</th>
					<th>
						<div class="new">
							<paper-icon-button icon="custom-icons:add" on-tap="_newDocTypeEventsInteractions">
							</paper-icon-button>

							<nuxeo-tooltip>New document type interactions</nuxeo-tooltip>
						</div>
					</th>
				</tr>
			</thead>

			<tbody>
				<template is="dom-repeat" items="[[ eventsSettings ]]" as="item" index-as="index">
					<tr class$="[[ item.invalid ]]">
						<td>
							<cp-selectivity data="[[ documentTypes ]]" value="{{item.docType}}"
								placeholder="Select a document type" on-selection-changed="_validate">
							</cp-selectivity>
						</td>
						<td>
							<cp-selectivity multiple data="[[ _eventTypes ]]" value="{{item.events}}"
								placeholder="Choose one or more event types" on-selection-changed="_validate">
							</cp-selectivity>
						</td>
						<td>
							<cp-selectivity multiple data="[[ _interactionsWithLabels ]]" value="{{item.interactions}}"
								placeholder="Pick one or more interactions" on-selection-changed="_validate">
							</cp-selectivity>
						</td>
						<td>
							<paper-toggle-button checked="{{item.active}}" on-change="_markAsDirty">
							</paper-toggle-button>
						</td>
						<td>
							<paper-menu-button close-on-activate allow-outside-scroll no-animations close-on-activate
								no-overlap horizontal-align="right" vertical-align="top">
								<paper-icon-button slot="dropdown-trigger" icon="icons:more-vert">
								</paper-icon-button>

								<paper-listbox slot="dropdown-content" attr-for-selected="data-id">
									<paper-item data-item-index$="[[ index ]]" on-tap="_deleteDocTypeEventSettings">
										Delete this document type interactions
									</paper-item>
								</paper-listbox>
							</paper-menu-button>
						</td>
					</tr>
				</template>
			</tbody>
		</table>

	</template>

	<script>
		Polymer({
			is: 'cp-settings-events',
			behaviors: [Nuxeo.LayoutBehavior, Nuxeo.ConfigurationBehaviour, Nuxeo.NotifyBehavior],
			properties: {
				eventsSettings: {
					type: Array,
					value: []
				},

				interactions: {
					type: Array,
					value: [],
				},

				documentTypes: {
					type: Array,
					value: [],
				},

				_dialogData: {
					type: Object,
					value: {
						docType: '',
						events: [],
						interactions: []
					}
				},

				_selectedEventSettingIndex: Number,

				_interactionsWithLabels: {
					type: Array,
					computed: '_compute_interactionsWithLabels(interactions)',
				},

				_eventTypes: {
					type: Array,
					value: [
						{ id: 'documentCreated', displayLabel: 'Document Created' },
						{ id: 'pictureViewsGenerationDone', displayLabel: 'Rendition Created' },
						{ id: 'beforeDocumentModification', displayLabel: 'Document Modified' }
					]
				}
			},

			_newDocTypeEventsInteractions()
			{
				if (!this.eventsSettings)
					this.set('eventsSettings', []);

				this.push('eventsSettings', {
					docType: '',
					events: [],
					interactions: [],
					invalid: 'invalid'
				});
			},

			_deleteDocTypeEventSettings(e)
			{
				const index = e.currentTarget.dataset.itemIndex;

				if (index == undefined || index < 0)
					return;

				const item = this.eventsSettings[index];
				if (confirm(`Are you sure you want to delete these settings?`))
				{
					this.eventsSettings.splice(index, 1);

					const eventsSettings = [...this.eventsSettings];
					this.set('eventsSettings', []);
					setTimeout(() =>
					{
						this.set('eventsSettings', eventsSettings);

						this._markAsDirty();
					});
				}
			},

			_markAsDirty()
			{
				this.fire('mark-as-dirty', { eventsSettings: this.eventsSettings.filter(item => item.docType && item.events?.length && item.interactions?.length) });
			},

			_validate(e)
			{
				const index = e?.model?.__data.index;
				const item = e?.model?.__data.item;

				if (item.docType && item.events?.length && item.interactions?.length)
				{
					this.set(`eventsSettings.${index}.invalid`, '');

					this._markAsDirty();
				}
				else
				{
					this.set(`eventsSettings.${index}.invalid`, 'invalid');
				}

				// Force Polymer to re-evaluate the second column's dom-if
				this.notifyPath(`eventsSettings.${index}.invalid`);
			},

			_compute_interactionsWithLabels()
			{
				return this.interactions.map(item => ({
					id: item.id,
					displayLabel: item.name,
				}));
			},

			_eventName(eventType)
			{
				return this._eventTypes.find(x => x.id === eventType)?.displayLabel;
			},

			_interactionName(interactions, interactionId)
			{
				return interactions.find(x => x.id === interactionId)?.name;
			}
		});
	</script>
</dom-module>
