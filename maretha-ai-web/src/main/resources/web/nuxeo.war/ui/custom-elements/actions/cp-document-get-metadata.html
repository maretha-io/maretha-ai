<dom-module id="cp-document-get-metadata">
	<template>
		<style include="nuxeo-action-button-styles">
			paper-menu-button {
				padding: 0
			}

			paper-item {
				@apply --layout-horizontal;
				@apply --layout-center;
				cursor: pointer;
			}

			paper-item {
				gap: .5rem;
			}
		</style>

		<template is="dom-if" if="[[ _showPopupMenuToggler ]]">
			<div class="action">
				<paper-menu-button id="dropdownButtonAi" no-animations close-on-activate no-overlap
					horizontal-align="right" opened="{{ _popupMenuVisible }}">
					<paper-icon-button id="aiButton" icon="custom-icons:ai-metadata" slot="dropdown-trigger"
						aria-labelledby="iconButtonAITooltip">
					</paper-icon-button>

					<paper-listbox id="menu" selectable="item" slot="dropdown-content" role="listbox" tabindex="0">
						<paper-item name="update" on-tap="_updateMetadata">
							<iron-icon icon="custom-icons:ai-metadata-update"></iron-icon>
							Update metadata
						</paper-item>

						<paper-item name="add" on-tap="_addMissingMetadata">
							<iron-icon icon="custom-icons:ai-metadata-missing"></iron-icon>
							Enhance metadata
						</paper-item>

						<paper-item name="regenerateEmbeddings" on-tap="_regenerateEmbeddings">
							<iron-icon icon="custom-icons:ai-metadata-update"></iron-icon>
							Regenerate embeddings
						</paper-item>
					</paper-listbox>
				</paper-menu-button>
				<nuxeo-tooltip for="dropdownButtonAi">AI Metadata</nuxeo-tooltip>
			</div>
		</template>

		<nuxeo-operation id="getInteractionsOp" op="GetInteractionsForDocumentOperation" input="[[document]]">
		</nuxeo-operation>

		<nuxeo-operation id="runInteractionOperation" op="RunInteractionOperation" input="[[document.uid]]">
		</nuxeo-operation>

		<nuxeo-operation id="regenerateEmbeddingsOperation" op="RegenerateEmbeddingsOperation" input="[[document.uid]]">
		</nuxeo-operation>
	</template>

	<script>
		Polymer({
			is: 'cp-document-get-metadata',
			behaviors: [Nuxeo.LayoutBehavior, Nuxeo.ConfigurationBehaviour],
			properties: {
				document: {
					type: Object
				},

				interactions: {
					type: Array,
					value: [],
					notify: true
				},

				selectedInteraction: {
					type: Object
				},

				interactionResponse: {
					type: String,
				},

				dialogOpened: {
					type: Boolean,
				},

				saveMetadataModeOverride: {
					type: Boolean
				},

				_showPopupMenuToggler: {
					type: Boolean,
					value: false
				},

				_popupMenuVisible: {
					type: Boolean,
					value: false
				}
			},

			observers: [
				'_documentUpdated(document.*)'
			],

			_documentUpdated(changes)
			{
				if (!changes.value)
					return;

				if (!this.interactions.length)
					this._getInteractions();
				else
					this.set('_showPopupMenuToggler', this.interactions.length > 0);
			},

			_getInteractions()
			{
				const operation = this.$.getInteractionsOp;
				operation.params = { "isMetadata": true };

				this.set('interactions', []);
				this.set('interactionResponse', null);

				operation.execute()
					.then((response) =>
					{
						this.set('interactions', response.value);

						const selectedInteraction = response.value.find(obj => obj.saveMetadata === true);
						this.set('selectedInteraction', selectedInteraction);

						this.set('_showPopupMenuToggler', this.interactions.length > 0);
					})
					.catch((error) =>
					{
						console.error('Error triggering operation:', error);
					});
			},

			_updateMetadata()
			{
				if (!this.selectedInteraction) 
				{
					this._popupMenuVisible = false;
					return;
				}

				this.set('_popupMenuVisible', false);

				this.set('interactionStatus', 'Waiting for AI response...');
				this.set('interactionResponse', '');
				const operation = this.$.runInteractionOperation;
				operation.params = {
					"interactionId": this.selectedInteraction.id,
					"data": this.selectedInteraction.parameters,
					"saveMetadata": this.selectedInteraction.saveMetadata,
					"saveMetadataModeOverride": true
				};
				this.fire('notify', { message: 'Metadata request in progress...' });
				operation.execute().then((response) =>
				{
					this.set('interactionResponse', response.value);
					this.set('interactionStatus', '');
					this.fire('document-updated');
				}).catch((error) =>
				{
					console.error('Error triggering operation:', error);
					this.fire('notify', { message: 'Cannot save metadata.' });
					this.set('interactionStatus', `<p>Error: ${error}</p>`);
				});
			},

			_addMissingMetadata()
			{
				if (!this.selectedInteraction)
				{
					this._popupMenuVisible = false;
					return;
				}

				this.set('_popupMenuVisible', false);

				this.set('interactionStatus', 'Waiting for AI response...');
				this.set('interactionResponse', '');
				const operation = this.$.runInteractionOperation;
				operation.params = {
					"interactionId": this.selectedInteraction.id,
					"data": this.selectedInteraction.parameters,
					"saveMetadata": this.selectedInteraction.saveMetadata,
					"saveMetadataModeOverride": false
				};
				this.fire('notify', { message: 'Metadata enhance request in progress...' });
				operation.execute().then((response) =>
				{
					this.set('interactionResponse', response.value);
					this.set('interactionStatus', '');
					this.fire('document-updated');
				}).catch((error) =>
				{
					console.error('Error triggering operation:', error);
					this.fire('notify', { message: 'Cannot save metadata.' });
					this.set('interactionStatus', `<p>Error: ${error}</p>`);
				});
			},

			_toggleDialog()
			{
				this.$.dialog.toggle();
			},

			_regenerateEmbeddings()
			{
				this.set('_popupMenuVisible', false);

				const operation = this.$.regenerateEmbeddingsOperation;
				operation.params = {};
				this.fire('notify', { message: 'Regenerating embeddings...' });
				operation.execute().then((response) =>
				{
					this.fire('notify', { message: response.value });
					this.fire('document-updated');
				}).catch((error) =>
				{
					console.error('Error regenerating embeddings:', error);
					this.fire('notify', { message: 'Cannot regenerate embeddings.' });
				});
			},

		});
	</script>
</dom-module>
